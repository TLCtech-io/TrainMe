<!doctype html>
<!-- Uptown Sound, "Pick Your Poison" show reel: Poison No. 1, TOXIC. 1080x1920 at 24000/1001 fps.
     Footage: "UpS Ref 10.15.26 Toxic Clip 1" (19.8s). Toxic liquid fills the lower third, breathes with the
     vocal loudness (data/features.js) and splashes on the "TOXIC" hits. Lyric hits use only confidently
     transcribed words (data/whisper-words.json). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Nosifer"; src: url("../shared/fonts/nosifer-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Creepster"; src: url("../shared/fonts/creepster-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Special Elite"; src: url("../shared/fonts/special-elite-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; src: url("../shared/fonts/anton-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Rubik Mono One"; src: url("../shared/fonts/rubik-mono-one-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Bowlby One SC"; src: url("../shared/fonts/bowlby-one-sc-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Abril Fatface"; src: url("../shared/fonts/abril-fatface-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Permanent Marker"; src: url("../shared/fonts/permanent-marker-latin-400-normal.woff2") format("woff2"); }
  :root { --toxic: #7cff3a; --toxic-hi: #c6ff7a; --toxic-deep: #0b3d0b; --paper: #f2ecdf; --ink: #111111; --blood: #c4161c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; }
  .abs { position: absolute; }
  #foot { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #fimg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 42%;
          filter: saturate(0.82) contrast(1.08) brightness(0.9); }
  #tint { position: absolute; inset: 0; background: rgba(70, 255, 60, 0.2); mix-blend-mode: soft-light; }
  /* Black gradient fades top and bottom (the smoky shadow border is drawn per frame on #smoke) */
  #shade { position: absolute; inset: 0;
           background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.55) 100%); }
  #smoke { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #flash { position: absolute; inset: 0; background: var(--toxic); mix-blend-mode: screen; opacity: 0; }
  #liquid { position: absolute; inset: 0; }
  #grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0.07; mix-blend-mode: overlay; }
  #webs { position: absolute; inset: 0; }

  /* Ransom-note lettering */
  .ransom { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; flex-wrap: nowrap; gap: 6px; }
  .rl { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px 4px; line-height: 1; box-shadow: 0 6px 14px rgba(0,0,0,0.45); }
  .gap { width: 30px; }

  .lyric { position: absolute; left: 0; width: 1080px; text-align: center; }
  .word { display: inline-block; margin: 0 10px; font: 400 92px/1.05 "Anton", sans-serif; letter-spacing: 0.02em; color: #fff;
          text-shadow: 0 4px 0 rgba(0,0,0,0.6), 0 0 26px rgba(0,0,0,0.55); text-transform: uppercase; }
  .toxic-word { font: 400 150px/1 "Nosifer", sans-serif; color: var(--toxic); letter-spacing: 0.02em;
                text-shadow: 0 0 18px rgba(124,255,58,0.9), 0 0 60px rgba(124,255,58,0.6), 0 8px 0 #052405; }
  .creep { font: 400 120px/1 "Creepster", sans-serif; color: var(--toxic-hi); letter-spacing: 0.04em;
           text-shadow: 0 0 22px rgba(124,255,58,0.8), 0 6px 0 rgba(0,0,0,0.7); }

  #badge { position: absolute; left: 0; width: 1080px; top: 150px; display: flex; justify-content: center; }
  .label { background: var(--paper); color: var(--ink); border: 5px solid var(--ink); border-radius: 10px; padding: 8px 22px 10px;
           display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 24px rgba(0,0,0,0.5); }
  .label .no { font: 400 30px/1 "Special Elite", monospace; letter-spacing: 0.06em; }
  .label .tx { font: 400 46px/1 "Nosifer", sans-serif; color: #1f8f10; }

  #badge .label { padding: 14px 32px 18px; gap: 22px; border-width: 6px; border-radius: 14px; }
  #badge .no { font-size: 42px; }
  #badge .tx { font-size: 72px; }

  #date { position: absolute; left: 240px; width: 600px; display: flex; justify-content: center; white-space: nowrap; }
  #end { position: absolute; inset: 0; }
  .end-line { position: absolute; left: 0; width: 1080px; text-align: center; }
  /* Queen City Performing Arts mark (one-colour knockout, shared/brand). Sized and placed per frame (see logoState);
     sized rather than scaled so the SVG is drawn sharp at every size. */
  #qcpa { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 50% 50%; }
  #qcpa img { display: block; width: 100%; height: 100%; }
  #fizz { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="foot"><img id="fimg" alt="" /><div id="tint"></div><canvas id="smoke" width="540" height="960"></canvas><div id="shade"></div></div>
  <svg id="webs" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <canvas id="liquid" width="1080" height="1920"></canvas>
  <div id="qcpa"><img src="../shared/brand/qcpa-logo-white.svg" alt="Queen City Performing Arts" /></div>
  <canvas id="fizz" width="1080" height="1920"></canvas>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="flash"></div>

  <!-- Title: PICK YOUR / POISON (ransom note), later compacts to the top -->
  <div id="title" class="abs" style="left:0; top:0; width:1080px; height:1920px">
    <div class="ransom" id="t1" style="top:300px"></div>
    <div class="ransom" id="t2" style="top:430px"></div>
  </div>
  <div id="badge"><div class="label"><span class="no">POISON PREVIEW:</span><span class="tx">TOXIC</span></div></div>

  <div class="lyric" id="paradise" style="top:600px"><span class="creep">paradise</span></div>
  <div class="lyric" id="dyk1" style="top:330px"></div>
  <div class="lyric" id="tox1" style="top:520px"><span class="toxic-word">TOXIC?</span></div>
  <div class="lyric" id="dyk2" style="top:330px"></div>
  <div class="lyric" id="tox2" style="top:520px"><span class="toxic-word">TOXIC?</span></div>
  <div class="lyric" id="wyp" style="top:420px"><span class="creep" style="font-size:104px">What's your poison?</span></div>
  <div id="date"></div>

  <div id="end">
    <div class="end-line" id="eUp" style="top:1095px; font:400 104px/1 'Anton'; letter-spacing:0.08em; color:#fff; text-shadow:0 6px 0 rgba(0,0,0,0.55)">UPTOWN SOUND</div>
    <div class="ransom" id="eTitle1" style="top:1225px"></div>
    <div class="ransom" id="eTitle2" style="top:1330px"></div>
    <div class="end-line" id="eDate" style="top:1450px; font:400 104px/1 'Bowlby One SC'; color:#0a1f0a; text-shadow:0 3px 0 rgba(255,255,255,0.35)">OCT 24 &amp; 25</div>
    <div class="end-line" id="eCta" style="top:1572px"><span style="display:inline-block; background:#0a0a0a; color:var(--toxic-hi); font:400 42px/1 'Special Elite'; padding:14px 26px; border-radius:8px; letter-spacing:0.06em">TICKETS &middot; LINK IN BIO</span></div>
  </div>

<script src="../shared/gsap.min.js"></script>
<script src="data/features.js"></script>
<script>
  const F = window.FEATURES, FPS = F.fps, D = F.duration;
  const FRAMES = "assets/frames/f_%05d.jpg";
  const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  const env = (t) => { const i = clamp(Math.floor(t * FPS), 0, F.env.length - 1); return F.env[i]; };

  // Cue times (seconds) from the transcript (data/whisper-words.json); only high-confidence words are captioned.
  const T = {
    poison: 1.56, paradise: 2.08, compact: 3.3,
    dyk1: [5.02, 5.40, 5.52, 5.92, 6.14], tox1: 6.68,
    date: 7.7, dateOut: 9.7,
    dyk2: [11.56, 11.70, 11.86, 12.22, 12.46], tox2: 12.80,
    wyp: 13.9, wypOut: 16.0, end: 16.2,
    logoIn: 1.5, logoUp: 16.25, zoom: 17.5, zoomEnd: 19.3,   // QCPA logo: surfaces, leaves the slime, zooms
  };
  const THUMB = location.search.includes("thumb");
  const DYK = ["Don't", "you", "know", "that", "you're"];

  // ---------- ransom-note lettering ----------
  const FONTS = ["Anton", "Rubik Mono One", "Bowlby One SC", "Abril Fatface", "Special Elite", "Permanent Marker", "Creepster"];
  const SWATCH = [["#f2ecdf", "#111"], ["#111", "#f2ecdf"], ["#7cff3a", "#0a1f0a"], ["#f2ecdf", "#c4161c"], ["#c4161c", "#fff"], ["#111", "#7cff3a"]];
  function ransom(el, text, size, seed) {
    el.innerHTML = [...text].map((ch, i) => {
      if (ch === " ") return '<span class="gap"></span>';
      const r = (k) => rnd(seed * 100 + i * 7 + k);
      const [bg, fg] = SWATCH[Math.floor(r(1) * SWATCH.length)];
      const font = FONTS[Math.floor(r(2) * FONTS.length)];
      const s = Math.round(size * (0.86 + r(3) * 0.3));
      const rot = (r(4) - 0.5) * 16;
      return `<span class="rl" style="background:${bg}; color:${fg}; font:400 ${s}px/1 '${font}'; transform:rotate(${rot.toFixed(1)}deg)">${ch}</span>`;
    }).join("");
  }
  ransom(document.getElementById("t1"), "PICK YOUR", 92, 3);
  ransom(document.getElementById("t2"), "POISON", 128, 7);
  ransom(document.getElementById("eTitle1"), "PICK YOUR", 76, 11);
  ransom(document.getElementById("eTitle2"), "POISON", 92, 13);
  document.getElementById("dyk1").innerHTML = DYK.map((w) => `<span class="word">${w}</span>`).join("");
  document.getElementById("dyk2").innerHTML = DYK.map((w) => `<span class="word">${w}</span>`).join("");
  document.getElementById("date").innerHTML =
    `<div class="label" style="flex-direction:column; gap:6px; padding:12px 26px"><span class="no" style="font-size:28px">LIVE ON STAGE</span>
     <span style="font:400 64px/1 'Bowlby One SC'; color:#111">OCT 24 &amp; 25</span></div>`;

  // ---------- spiderwebs in the top corners (their Canva look) ----------
  function web(cx, cy, r, a0, a1, spokes, rings) {
    let d = "";
    const ang = (k) => a0 + ((a1 - a0) * k) / (spokes - 1);
    for (let k = 0; k < spokes; k++) d += `M${cx},${cy} L${cx + r * Math.cos(ang(k))},${cy + r * Math.sin(ang(k))} `;
    for (let j = 1; j <= rings; j++) {
      const rr = (r * j) / (rings + 0.4);
      for (let k = 0; k < spokes - 1; k++) {
        const p = [Math.cos(ang(k)) * rr, Math.sin(ang(k)) * rr], q = [Math.cos(ang(k + 1)) * rr, Math.sin(ang(k + 1)) * rr];
        const m = [(p[0] + q[0]) / 2 * 0.86, (p[1] + q[1]) / 2 * 0.86];
        d += `M${cx + p[0]},${cy + p[1]} Q${cx + m[0]},${cy + m[1]} ${cx + q[0]},${cy + q[1]} `;
      }
    }
    return `<path d="${d}" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="2.2"/>`;
  }
  document.getElementById("webs").innerHTML =
    web(0, 0, 440, 0.02, 1.55, 8, 7) + web(1080, 0, 400, Math.PI - 1.55, Math.PI - 0.02, 8, 7) +
    web(0, 1170, 210, -1.2, 1.2, 7, 5) + web(1080, 1130, 200, Math.PI - 1.2, Math.PI + 1.2, 7, 5);

  // ---------- timeline (text and title choreography) ----------
  const tl = gsap.timeline({ paused: true });
  // Title letters stamp in
  document.querySelectorAll("#t1 .rl, #t2 .rl").forEach((el, i) => {
    tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 0.05 + i * 0.075);
  });
  // "POISON" is sung: the word lights up toxic green and shakes
  document.querySelectorAll("#t2 .rl").forEach((el, i) => {
    tl.to(el, { backgroundColor: "#7cff3a", color: "#0a1f0a", duration: 0.08 }, T.poison + i * 0.04);
    tl.to(el, { y: -10, duration: 0.07, yoyo: true, repeat: 3 }, T.poison + i * 0.04);
  });
  tl.fromTo("#t2", { filter: "drop-shadow(0 0 0px rgba(124,255,58,0))" }, { filter: "drop-shadow(0 0 28px rgba(124,255,58,0.95))", duration: 0.2 }, T.poison);
  tl.fromTo("#paradise", { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, T.paradise);
  tl.to("#paradise", { opacity: 0, duration: 0.3 }, T.compact - 0.2);
  // Title compacts into the badge area, badge drops in
  tl.to("#title", { opacity: 0, y: -160, scale: 0.6, duration: 0.45, ease: "power3.in", transformOrigin: "50% 15%" }, T.compact);
  tl.fromTo("#badge", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, T.compact + 0.3);
  // "Don't you know that you're ... TOXIC?" x2
  [["#dyk1", T.dyk1, "#tox1", T.tox1], ["#dyk2", T.dyk2, "#tox2", T.tox2]].forEach(([dyk, cues, tox, tt]) => {
    document.querySelectorAll(`${dyk} .word`).forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out" }, cues[i] - 0.04);
    });
    tl.fromTo(tox, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, tt - 0.06);
    tl.to(tox, { scale: 1.06, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, tt + 0.15);
    tl.to([dyk, tox], { opacity: 0, y: -30, duration: 0.4 }, tt + 1.3);
    tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05 }, tt - 0.02);
    tl.to("#flash", { opacity: 0, duration: 0.35 }, tt + 0.05);
  });
  // Floating date label rides the liquid surface (y set per frame)
  tl.fromTo("#date", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.date);
  tl.to("#date", { opacity: 0, duration: 0.3 }, T.dateOut);
  tl.fromTo("#wyp", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T.wyp);
  tl.to("#wyp", { opacity: 0, duration: 0.3 }, T.wypOut);
  // End card (the QCPA logo rises out of the slime per frame, see logoState), then the show lockup
  tl.to("#badge", { opacity: 0, duration: 0.3 }, T.end);
  tl.fromTo("#eUp", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.end + 0.55);
  document.querySelectorAll("#eTitle1 .rl, #eTitle2 .rl").forEach((el, i) => {
    tl.fromTo(el, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, T.end + 0.8 + i * 0.05);
  });
  tl.fromTo("#eDate", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, T.end + 1.75);
  tl.fromTo("#eCta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T.end + 2.15);
  tl.to("#eCta", { scale: 1.06, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.end + 2.7);

  // ---------- per-frame: liquid, bubbles, splashes, footage punch, grain ----------
  const cv = document.getElementById("liquid"), cx = cv.getContext("2d");
  const gv = document.getElementById("grain"), gx = gv.getContext("2d");
  const hits = [T.tox1, T.tox2];
  const ONSETS = F.onsets;
  const surge = (t) => hits.reduce((s, h) => s + (t >= h ? 150 * Math.exp(-(t - h) * 2.2) * Math.min(1, (t - h) / 0.08) : 0), 0);
  function level(t) {
    const intro = 1 - ease(clamp(t / 0.7, 0, 1));                 // fills up from the bottom in the first 0.7s
    const endRise = ease(clamp((t - T.end) / 1.0, 0, 1));         // rises to hold the end card
    const base = 1470 - 95 * env(t) - surge(t);
    return base + intro * 520 - endRise * (base - 1060);
  }
  function surface(x, t) {
    const a = 1 + 1.4 * env(t) + surge(t) / 60;
    return level(t) + a * (12 * Math.sin(x * 0.010 + t * 2.1) + 7 * Math.sin(x * 0.023 - t * 3.3) + 4 * Math.sin(x * 0.051 + t * 5.0));
  }
  const fv = document.getElementById("fizz"), fx = fv.getContext("2d");
  function slimeGrad(ctx, L) {
    const g = ctx.createLinearGradient(0, L - 40, 0, 1920);
    g.addColorStop(0, "rgba(150,255,70,0.93)"); g.addColorStop(0.18, "rgba(70,215,25,0.94)"); g.addColorStop(1, "rgba(8,52,8,0.98)");
    return g;
  }
  function drawLiquid(t) {
    cx.clearRect(0, 0, 1080, 1920);
    fx.clearRect(0, 0, 1080, 1920);
    const L = level(t);
    // fumes above the surface
    for (let k = 0; k < 9; k++) {
      const ph = (t * 0.22 + rnd(k)) % 1, x = 60 + rnd(k + 20) * 960 + Math.sin(t * 0.8 + k) * 30, y = L - 40 - ph * 360;
      const r = 90 + rnd(k + 40) * 110, a = 0.10 * Math.sin(Math.PI * ph) * (0.6 + env(t));
      const g = cx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(140,255,80,${a})`); g.addColorStop(1, "rgba(140,255,80,0)");
      cx.fillStyle = g; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    // body
    const body = new Path2D(); body.moveTo(0, 1920);
    for (let x = 0; x <= 1080; x += 12) body.lineTo(x, surface(x, t));
    body.lineTo(1080, 1920); body.closePath();
    cx.fillStyle = slimeGrad(cx, L); cx.fill(body);
    // --- everything below goes on #fizz, in front of the logo ---
    // the slime again, translucent, so the floating logo reads as submerged (same colours: the slime itself is unchanged)
    fx.save(); fx.globalAlpha = 0.24; fx.fillStyle = slimeGrad(fx, L); fx.fill(body); fx.restore();
    // glowing surface line
    fx.save(); fx.shadowColor = "rgba(160,255,90,0.95)"; fx.shadowBlur = 34; fx.lineWidth = 7; fx.strokeStyle = "rgba(205,255,140,0.95)";
    fx.beginPath(); for (let x = 0; x <= 1080; x += 12) (x ? fx.lineTo : fx.moveTo).call(fx, x, surface(x, t)); fx.stroke(); fx.restore();
    // rising bubbles (deterministic; density follows the vocal loudness)
    for (let i = 0; i < 90; i++) {
      const P = 1.4 + rnd(i) * 2.6, v = 140 + rnd(i + 300) * 220, r0 = 5 + rnd(i + 600) * 17;
      const cyc = Math.floor((t + rnd(i + 900) * P) / P), age = (t + rnd(i + 900) * P) % P;
      if (rnd(i * 31 + cyc) > 0.3 + 0.7 * env(t)) continue;
      const x = 30 + rnd(i * 13 + cyc) * 1020 + Math.sin(age * 5 + i) * 10, y = 1930 - age * v, s = surface(x, t);
      if (y < s - 4) {
        const dt = (s - 4 - y) / v; // time since it reached the surface
        if (dt < 0.16) { fx.strokeStyle = `rgba(220,255,170,${0.9 * (1 - dt / 0.16)})`; fx.lineWidth = 2.5; fx.beginPath(); fx.arc(x, s - 6, r0 * (1 + dt * 9), 0, 7); fx.stroke(); }
        continue;
      }
      fx.fillStyle = "rgba(210,255,160,0.22)"; fx.strokeStyle = "rgba(225,255,185,0.85)"; fx.lineWidth = 2.2;
      fx.beginPath(); fx.arc(x, y, r0, 0, 7); fx.fill(); fx.stroke();
      fx.fillStyle = "rgba(255,255,255,0.75)"; fx.beginPath(); fx.arc(x - r0 * 0.35, y - r0 * 0.35, r0 * 0.22, 0, 7); fx.fill();
    }
    // splashes: droplets thrown up on onsets and big on the TOXIC hits
    const events = ONSETS.map((o) => [o, 6]).concat(hits.map((h) => [h, 26]), [[T.logoUp + 0.15, 18]]); // + the logo leaving the slime
    for (const [o, n] of events) {
      const dt = t - o; if (dt < 0 || dt > 0.9) continue;
      for (let k = 0; k < n; k++) {
        const x0 = 60 + rnd(o * 97 + k) * 960, v0 = 380 + rnd(o * 53 + k) * (n > 10 ? 900 : 420), vx = (rnd(o * 17 + k) - 0.5) * 260;
        const y = surface(x0, o) - (v0 * dt - 0.5 * 2600 * dt * dt), x = x0 + vx * dt;
        if (y > surface(x, t) + 6) continue;
        const rr = 4 + rnd(o * 7 + k) * (n > 10 ? 12 : 6);
        fx.fillStyle = "rgba(170,255,90,0.95)"; fx.shadowColor = "rgba(150,255,80,0.9)"; fx.shadowBlur = 14;
        fx.beginPath(); fx.arc(x, y, rr, 0, 7); fx.fill(); fx.shadowBlur = 0;
      }
    }
  }
  // Smoky shadow border: a dark spotlight vignette on the soloist plus drifting black smoke blobs around the edges.
  const sv = document.getElementById("smoke"), sx = sv.getContext("2d");
  let SPOT_Y = 420; // spotlight centre on the smoke canvas (half-resolution)
  function drawSmoke(t) {
    const H2 = sv.height;
    sx.clearRect(0, 0, 540, H2);
    const v = sx.createRadialGradient(270, SPOT_Y - 20, 70, 270, SPOT_Y, 560);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(0.45, "rgba(0,0,0,0.22)"); v.addColorStop(0.8, "rgba(0,0,0,0.7)"); v.addColorStop(1, "rgba(0,0,0,0.92)");
    sx.fillStyle = v; sx.fillRect(0, 0, 540, H2);
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + Math.sin(t * 0.25 + i) * 0.08;
      const ex = 270 + Math.cos(a) * 330, ey = H2 / 2 + Math.sin(a) * H2 * 0.583;    // just outside the frame edge
      const x = clamp(ex, -40, 580) + Math.sin(t * 0.4 + i * 1.7) * 18, y = clamp(ey, -40, H2 + 40) + Math.cos(t * 0.35 + i) * 18;
      const r = 120 + rnd(i + 70) * 140, al = 0.35 + rnd(i + 90) * 0.3;
      const g = sx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(0,0,0,${al})`); g.addColorStop(1, "rgba(0,0,0,0)");
      sx.fillStyle = g; sx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  function drawGrain(t) {
    const img = gx.createImageData(540, 960), d = img.data, seed = Math.floor(t * FPS) * 7919;
    for (let p = 0; p < d.length; p += 4) { const v = (rnd(seed + p * 0.25) * 255) | 0; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }
    gx.putImageData(img, 0, 0);
  }

  // ---------- QCPA logo: floats in the slime, rises to the dark wall at the end card, then zooms to fill it ----------
  const qcpa = document.getElementById("qcpa"), qimg = qcpa.querySelector("img");
  const ASPECT = 253.262 / 340.77;                           // width / height of the logo artwork
  const span = (a, b, t) => clamp((t - a) / (b - a), 0, 1);
  // smoothed slime level under the logo, so it rides the surges like a float instead of jittering with each frame
  const buoy = (t) => { let s = 0, w = 0; for (let i = 0; i <= 20; i++) { const k = Math.exp(-i * 0.18); s += k * surface(540, t - i * 0.03); w += k; } return s / w; };
  function logoState(t) {
    if (THUMB) return { cx: 540, cy: 1666 + 112, h: 224, rot: 0, a: 1, wet: false }; // 3:4 cover: under the ticket line
    // 1) surfaces at T.logoIn and floats just under the slime, bobbing and tilting with the waves
    const fin = 1 - Math.pow(1 - span(T.logoIn, T.logoIn + 0.7, t), 2);
    // ...and sinks a little while the floating date label rides over it
    const dip = 60 * (ease(span(T.date - 0.2, T.date + 0.3, t)) - ease(span(T.dateOut, T.dateOut + 0.5, t)));
    let h = 300, top = buoy(t) + 8 + dip + Math.sin(t * 2.0) * 5 + (1 - fin) * 120, x = 540 + Math.sin(t * 0.9) * 10;
    let rot = clamp(Math.atan2(surface(650, t) - surface(430, t), 220) * 57.3 * 0.5, -5, 5) + Math.sin(t * 1.3) * 1.5;
    // 2) end card: pops out of the slime up to the dark wall above the group
    const up = ease(span(T.logoUp, T.logoUp + 0.7, t));
    top += (190 - top) * up; x += (540 - x) * up; rot *= 1 - up;
    // 3) zooms and pans to fill the dark above the slime, slow to fast
    const z = Math.pow(span(T.zoom, T.zoomEnd, t), 2);
    top += (268 - top) * z; h += (736 - h) * z;
    return { cx: x, cy: top + h / 2, h, rot, a: fin, wet: up < 0.5 };
  }
  function drawLogo(t) {
    const L = logoState(t), w = L.h * ASPECT;
    qcpa.style.opacity = L.a.toFixed(3);
    qcpa.style.width = w.toFixed(2) + "px"; qcpa.style.height = L.h.toFixed(2) + "px";
    qcpa.style.transform = `translate(${(L.cx - w / 2).toFixed(2)}px, ${(L.cy - L.h / 2).toFixed(2)}px) rotate(${L.rot.toFixed(2)}deg)`;
    qimg.style.filter = `drop-shadow(0 6px 18px rgba(0,0,0,${L.wet ? 0.45 : 0.7}))`;
  }

  const fimg = document.getElementById("fimg"), dateEl = document.getElementById("date");
  let lastSrc = "";
  async function seek(t) {
    tl.seek(t, false);
    drawLiquid(t);
    drawSmoke(t);
    drawGrain(t);
    drawLogo(t);
    // footage punch-ins on the TOXIC hits, plus a slight darkening under the end card
    let s = 1;
    for (const h of hits) if (t >= h) s += 0.07 * Math.exp(-(t - h) * 2.5) * Math.min(1, (t - h) / 0.06);
    fimg.style.transform = `scale(${s})`;
    // Footage sits on black at 74% (darker still under the end card), slightly desaturated; it goes to black
    // under the logo zoom so the logo lands on black (the 3:4 cover keeps the group)
    fimg.style.filter = "saturate(0.68) contrast(1.14) brightness(0.96)";
    const dark = THUMB ? 0 : ease(span(T.zoom, T.zoomEnd, t));
    fimg.style.opacity = String((0.74 - 0.16 * ease(clamp((t - T.end) / 1, 0, 1))) * (1 - dark));
    dateEl.style.top = `${surface(540, t) - 120 + Math.sin(t * 3.1) * 8}px`;
    dateEl.style.transform = `rotate(${Math.sin(t * 2.3) * 4}deg)`;
    const n = Math.min(F.env.length, Math.floor(t * FPS + 1e-6) + 1);
    const src = FRAMES.replace("%05d", String(n).padStart(5, "0"));
    if (src !== lastSrc) { fimg.src = src; lastSrc = src; try { await fimg.decode(); } catch (e) {} }
  }
  // ?bare: no webs, smoke border, fades or grain (thumb.html re-applies them for its own 3:4 frame)
  if (location.search.includes("bare")) ["webs", "smoke", "shade", "grain"].forEach((id) => (document.getElementById(id).style.display = "none"));

  // ?thumb: 3:4 cover (1080x1440) cut from the bottom of the frame. Footage, slime and text move up by 480px;
  // the webs, smoky vignette, fades and grain are redrawn for the 3:4 frame instead of being cropped off.
  let H = 1920;
  if (THUMB) {
    H = 1440; const OFF = 1920 - H;
    document.documentElement.style.height = document.body.style.height = H + "px";
    fimg.style.top = -OFF + "px";
    const shift = document.createElement("div");
    Object.assign(shift.style, { position: "absolute", left: "0px", top: -OFF + "px", width: "1080px", height: "1920px" });
    document.getElementById("liquid").before(shift);
    ["liquid", "fizz", "qcpa", "title", "badge", "paradise", "dyk1", "tox1", "dyk2", "tox2", "wyp", "date", "end"].forEach((id) => shift.appendChild(document.getElementById(id)));
    document.body.appendChild(document.getElementById("grain"));
    document.body.appendChild(document.getElementById("flash"));
    sv.height = H / 2; sv.style.height = H + "px"; SPOT_Y = 170;
    // the wall above the group is cropped off here, so the logo sits in the dark slime under the ticket line,
    // in front of the bubbles (logoState); it is stacked after #fizz above
    document.getElementById("grain").style.height = H + "px";
    const w = document.getElementById("webs");
    w.setAttribute("height", H); w.setAttribute("viewBox", `0 0 1080 ${H}`);
    w.innerHTML = web(0, 0, 440, 0.02, 1.55, 8, 7) + web(1080, 0, 400, Math.PI - 1.55, Math.PI - 0.02, 8, 7);
  }
  window.__tl = tl;
  window.__meta = { duration: D, width: 1080, height: H };
  window.__seek = seek;
  seek(0);
</script>
