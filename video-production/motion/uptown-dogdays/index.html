<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Uptown Sound: one last show</title>
<!--
  Uptown Sound "Pick Your Poison" last-show push on "10.24 2nd Show Dog Days" (the Saturday night show, from the house;
  1080x1920 from 1440x2560, 30 fps, 14.9 s). The clip is used as delivered and its audio is copied untouched.
  The verse here runs "...like a train on a track", so the post is a station departure board: split-flap letters clatter
  into ONE LAST SHOW in the dark opening, the board below lists PICK YOUR POISON / SUN 10/25 1:00 PM / FINAL CALL as the
  ensemble comes into view, the header flips to DON'T MISS OUT with the user's line (don't let missing the show ruin
  your day), and everything flips over to the end card. Flaps land on the vocal onsets.
-->
<style>
  @font-face { font-family: "Rubik Mono One"; src: url("../shared/fonts/rubik-mono-one-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; src: url("../shared/fonts/anton-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Special Elite"; src: url("../shared/fonts/special-elite-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Bowlby One SC"; src: url("../shared/fonts/bowlby-one-sc-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Abril Fatface"; src: url("../shared/fonts/abril-fatface-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Permanent Marker"; src: url("../shared/fonts/permanent-marker-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Creepster"; src: url("../shared/fonts/creepster-latin-400-normal.woff2") format("woff2"); }
  :root { --amber: #ffb23a; --bone: #f4efe2; --red: #ff4a3d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; }
  canvas { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #scrimTop { background: linear-gradient(180deg, rgba(0,0,0,0.82) 0px, rgba(0,0,0,0.55) 330px, rgba(0,0,0,0) 600px); opacity: 0; }
  #scrimBot { background: linear-gradient(180deg, rgba(0,0,0,0) 1250px, rgba(0,0,0,0.7) 1500px, rgba(0,0,0,0.85) 1920px); }
  #grain { width: 1080px; height: 1920px; opacity: 0.06; mix-blend-mode: overlay; }
  /* split-flap tiles */
  .row { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; gap: 5px; }
  .tile { position: relative; overflow: hidden; border-radius: 7px; background: linear-gradient(#1d1d1d, #111 50%, #191919 50%, #0e0e0e);
          box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06); font-family: "Rubik Mono One"; color: var(--bone); }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: #000; }
  .h, .flap { position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden; }
  .h.top, .flap.top { top: 0; } .h.bot, .flap.bot { top: 50%; }
  .flap.top { transform-origin: 50% 100%; background: linear-gradient(#2a2a2a, #191919); }
  .flap.bot { transform-origin: 50% 0%; background: linear-gradient(#141414, #0c0c0c); }
  .tile span { position: absolute; left: 0; width: 100%; text-align: center; }
  .amber { color: var(--amber); } .red { color: var(--red); }
  #board { position: absolute; left: 22px; width: 1036px; top: 1392px; height: 430px; border-radius: 18px; opacity: 0;
           background: linear-gradient(#0c0c0c, #050505); border: 3px solid #2b2b2b; box-shadow: 0 18px 40px rgba(0,0,0,0.7); }
  #board .label { position: absolute; left: 28px; top: 16px; font: 400 30px/1 "Anton"; letter-spacing: 0.32em; color: var(--amber); }
  #board .label2 { position: absolute; right: 28px; top: 16px; font: 400 30px/1 "Anton"; letter-spacing: 0.2em; color: #8d8d8d; }
  .line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; opacity: 0; }
  .ransom { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; flex-wrap: nowrap; gap: 6px; }
  .rl { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px 4px; line-height: 1; box-shadow: 0 6px 14px rgba(0,0,0,0.5); opacity: 0; }
  .gap { width: 30px; }
  #qcpa { position: absolute; opacity: 0; }
</style>
</head>
<body>
  <canvas id="v" width="1080" height="1920"></canvas>
  <div id="scrimTop" class="layer"></div>
  <div id="scrimBot" class="layer"></div>

  <div id="head" class="row"></div>
  <div class="line" id="sub1" style="top:262px; font:400 60px/1 'Anton'; letter-spacing:0.04em; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,0.8), 0 0 18px rgba(0,0,0,0.9)">DON'T LET MISSING THE SHOW</div>
  <div class="line" id="sub2" style="top:338px; font:400 120px/1 'Permanent Marker'; color:var(--amber); transform:rotate(-3deg); text-shadow:0 5px 0 rgba(0,0,0,0.85), 0 0 24px rgba(0,0,0,0.9)">RUIN YOUR DAY</div>
  <div class="ransom" id="eT1" style="top:262px"></div>
  <div class="ransom" id="eT2" style="top:336px"></div>

  <div id="board">
    <div class="label">DEPARTURES</div>
    <div class="label2">UPTOWN SOUND</div>
    <div id="r1" class="row" style="left:-22px; top:70px"></div>
    <div id="r2" class="row" style="left:-22px; top:180px"></div>
    <div id="r3" class="row" style="left:-22px; top:290px"></div>
  </div>
  <img id="qcpa" src="../shared/brand/qcpa-logo-white.svg" alt="Queen City Performing Arts" />
  <canvas id="grain" width="540" height="960"></canvas>

<script src="../shared/gsap.min.js"></script>
<script src="data/features.js"></script>
<script>
  const F = window.FEATURES, FPS = 30, NF = 447, D = NF / FPS;
  const FRAMES = "assets/frames/f_%05d.jpg";
  const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const byId = (id) => document.getElementById(id);

  // Cue times (s): the flaps land on the vocal onsets; the camera finds the stage at ~3.4 s.
  const T = { head1: 0.35, headLand: 2.69, headUp: 3.45, board: 3.6, r1: 3.71, r2: 4.74, r3: 5.72, miss: 9.14, sub: 10.64,
              end: 12.2, endRows: 12.48, logo: 12.7 };

  // ---------- split-flap tiles ----------
  // Each tile flips through a few random letters to its next character, 40 ms a flap, landing at a given time.
  const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:/'";
  const DT = 0.04;
  function makeRow(el, n, w, h, size) {
    el.innerHTML = [...Array(n)].map(() => `<div class="tile" style="width:${w}px; height:${h}px; font-size:${size}px">
      <div class="h top"><span style="top:0; line-height:${h}px; height:${h}px"></span></div>
      <div class="h bot"><span style="top:${-h / 2}px; line-height:${h}px; height:${h}px"></span></div>
      <div class="flap top"><span style="top:0; line-height:${h}px; height:${h}px"></span></div>
      <div class="flap bot"><span style="top:${-h / 2}px; line-height:${h}px; height:${h}px"></span></div></div>`).join("");
    return [...el.children].map((t, i) => ({ el: t, spans: [...t.querySelectorAll("span")], flaps: [...t.querySelectorAll(".flap")], ev: [], i }));
  }
  const pad = (s, n) => { const l = Math.floor((n - s.length) / 2); return (" ".repeat(l) + s).padEnd(n, " ").slice(0, n); };
  // queue a change of the whole row to text, letters landing from land0 over spread seconds (left to right)
  function setRow(tiles, text, land0, spread, cls = "", seed = 1) {
    const s = pad(text, tiles.length);
    tiles.forEach((tile, i) => {
      const land = land0 + spread * (i / Math.max(1, tiles.length - 1)) + (rnd(seed * 31 + i) - 0.5) * 0.06;
      const prev = tile.ev.length ? tile.ev[tile.ev.length - 1].to : " ";
      if (prev === s[i] && !cls) { tile.ev.push({ t0: land, land, seq: [prev, s[i]], to: s[i], cls: tile.ev.length ? tile.ev[tile.ev.length - 1].cls : cls }); return; }
      const k = s[i] === " " && prev === " " ? 0 : 3 + Math.floor(rnd(seed * 17 + i) * 6);
      const seq = [prev, ...[...Array(k)].map((_, j) => GLYPHS[Math.floor(rnd(seed * 101 + i * 13 + j) * GLYPHS.length)]), s[i]];
      tile.ev.push({ t0: land - (seq.length - 1) * DT, land, seq, to: s[i], cls });
    });
  }
  function drawRow(tiles, t) {
    tiles.forEach((tile) => {
      let ev = null;
      for (const e of tile.ev) if (t >= e.t0) ev = e;
      let top, bot, ftop = null, fbot = null, p = 0;
      if (!ev) { top = bot = " "; }
      else {
        const x = (t - ev.t0) / DT, k = Math.floor(x);
        if (k >= ev.seq.length - 1) { top = bot = ev.to; }
        else {
          const a = ev.seq[k], b = ev.seq[k + 1]; p = x - k;
          top = b; bot = a;                                      // the new letter's top is revealed behind the falling flap
          if (p < 0.5) ftop = a; else fbot = b;
        }
      }
      const [sTop, sBot, sFT, sFB] = tile.spans;
      sTop.textContent = top; sBot.textContent = bot;
      tile.el.className = "tile " + (ev ? ev.cls : "");
      tile.flaps[0].style.display = ftop !== null ? "" : "none";
      tile.flaps[1].style.display = fbot !== null ? "" : "none";
      if (ftop !== null) { sFT.textContent = ftop; tile.flaps[0].style.transform = `scaleY(${(1 - 2 * p).toFixed(3)})`; }
      if (fbot !== null) { sFB.textContent = fbot; tile.flaps[1].style.transform = `scaleY(${(2 * p - 1).toFixed(3)})`; }
    });
  }
  const HEAD = makeRow(byId("head"), 14, 70, 104, 73);
  const R1 = makeRow(byId("r1"), 18, 52, 90, 54), R2 = makeRow(byId("r2"), 18, 52, 90, 54), R3 = makeRow(byId("r3"), 18, 52, 90, 54);
  setRow(HEAD, "ONE LAST SHOW", T.headLand - 1.2, 1.2, "", 3);
  setRow(HEAD, "DON'T MISS OUT", T.miss, 0.55, "amber", 5);
  setRow(HEAD, "UPTOWN SOUND", T.end, 0.5, "", 7);
  setRow(R1, "PICK YOUR POISON", T.r1 + 0.35, 0.7, "", 11);
  setRow(R2, "SUN 10/25  1:00 PM", T.r2 + 0.3, 0.7, "", 13);
  setRow(R3, "FINAL CALL", T.r3 + 0.15, 0.3, "red", 17);
  setRow(R1, "FINAL SHOW", T.endRows, 0.35, "", 19);
  setRow(R3, "TIX: LINK IN BIO", T.endRows + 0.15, 0.4, "amber", 23);

  // ---------- series lettering for the end card ----------
  const FONTS = ["Anton", "Rubik Mono One", "Bowlby One SC", "Abril Fatface", "Special Elite", "Permanent Marker", "Creepster"];
  const SWATCH = [["#f2ecdf", "#111"], ["#111", "#ffb23a"], ["#ffb23a", "#111"], ["#b3001b", "#f2ecdf"], ["#111", "#f2ecdf"], ["#f2ecdf", "#b3001b"]];
  function ransom(el, text, size, seed) {
    el.innerHTML = [...text].map((ch, i) => {
      if (ch === " ") return '<span class="gap"></span>';
      const r = (k) => rnd(seed * 100 + i * 7 + k);
      const [bg, fg] = SWATCH[Math.floor(r(1) * SWATCH.length)];
      const font = FONTS[Math.floor(r(2) * FONTS.length)];
      const s = Math.round(size * (0.86 + r(3) * 0.3)), rot = (r(4) - 0.5) * 16;
      return `<span class="rl" style="background:${bg}; color:${fg}; font:400 ${s}px/1 '${font}'; transform:rotate(${rot.toFixed(1)}deg)">${ch}</span>`;
    }).join("");
  }
  ransom(byId("eT1"), "PICK YOUR", 56, 51);
  ransom(byId("eT2"), "POISON", 70, 53);

  // ---------- timeline ----------
  const tl = gsap.timeline({ paused: true });
  gsap.set("#head", { top: 820 });
  tl.to("#head", { top: 128, duration: 0.5, ease: "power3.inOut" }, T.headUp);
  tl.to("#scrimTop", { opacity: 1, duration: 0.5 }, T.headUp);
  tl.fromTo("#board", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.board);
  tl.fromTo("#sub1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T.sub);
  tl.fromTo("#sub2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, T.sub + 0.45);
  tl.to(["#sub1", "#sub2"], { opacity: 0, duration: 0.2 }, T.end - 0.15);
  document.querySelectorAll("#eT1 .rl, #eT2 .rl").forEach((el, i) => {
    tl.fromTo(el, { opacity: 0, scale: 2.3 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power4.in" }, T.end + 0.25 + i * 0.04);
  });
  tl.fromTo("#qcpa", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T.logo);
  const qcpa = byId("qcpa"), ASPECT = 253.262 / 340.77;
  Object.assign(qcpa.style, { height: "84px", width: `${84 * ASPECT}px`, left: `${540 - 42 * ASPECT}px`, top: "1830px" });

  // ---------- per frame ----------
  const vc = byId("v").getContext("2d");
  const fimg = new Image();
  let lastSrc = "";
  function drawGrain(t) {
    const gx = byId("grain").getContext("2d"), img = gx.createImageData(540, 960), dd = img.data, seed = Math.floor(t * FPS) * 7919;
    for (let p = 0; p < dd.length; p += 4) { const v = (rnd(seed + p * 0.25) * 255) | 0; dd[p] = dd[p + 1] = dd[p + 2] = v; dd[p + 3] = 255; }
    gx.putImageData(img, 0, 0);
  }
  async function seek(t) {
    tl.seek(t, false);
    const n = Math.min(NF, Math.floor(t * FPS + 1e-6) + 1);
    const src = FRAMES.replace("%05d", String(n).padStart(5, "0"));
    if (src !== lastSrc) { fimg.src = src; lastSrc = src; try { await fimg.decode(); } catch (e) { console.error("frame", n, e.message); } }
    vc.filter = "contrast(1.07) saturate(1.1) brightness(1.03)";
    vc.drawImage(fimg, 0, 0, 1080, 1920);
    drawRow(HEAD, t); drawRow(R1, t); drawRow(R2, t); drawRow(R3, t);
    // FINAL CALL blinks once it has landed, until the end card turns the row over
    const blink = t > T.r3 + 0.6 && t < T.endRows ? (Math.floor((t - T.r3) * 2.4) % 2 ? 0.25 : 1) : 1;
    R3.forEach((tile) => { if (tile.el.classList.contains("red")) tile.spans[0].style.opacity = tile.spans[1].style.opacity = blink; else tile.spans[0].style.opacity = tile.spans[1].style.opacity = 1; });
    drawGrain(t);
  }

  (async () => {
    await Promise.all(["400 60px 'Rubik Mono One'", "400 60px Anton", "400 60px 'Permanent Marker'", "400 60px 'Bowlby One SC'"].map((f) => document.fonts.load(f)));
    await document.fonts.ready;
    window.__seek = seek;
    await seek(0);
    window.__tl = tl;
    window.__meta = { duration: D, width: 1080, height: 1920 };
  })();
</script>
</body>
</html>
