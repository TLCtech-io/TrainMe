<!doctype html>
<!-- IMP - Span of Control, segment A overlays (scenes 14 to 17), rendered with a transparent background (ProRes 4444)
     to sit on top of Descript stock footage. ?scene=14|15|16|17 picks the scene; each clip is its scene's length.
     ?preview puts a stand-in footage frame and the caption gradient behind it, for review stills only.
     Times are seconds from the scene's start, from Rick's words (whisper, 2026-11-19). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../shared/tma.css" />
<style>
  html, body { background: transparent; }
  .scene { position: absolute; inset: 0; display: none; }
  .preview body, body.preview { background: linear-gradient(135deg, #5b6470, #2f3640 60%, #20252c); }
  #pv { position: absolute; inset: 0; display: none; background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,0.78) 100%); }
  .preview #pv { display: block; }

  /* S14: reminders pile up */
  .note { position: absolute; left: 1150px; width: 650px; height: 112px; border-radius: 26px; background: rgba(255,255,255,0.96);
          box-shadow: 0 18px 40px rgba(0,0,0,0.28); display: flex; align-items: center; gap: 22px; padding: 0 26px; }
  .note .ic { width: 64px; height: 64px; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font: 900 34px/1 "Roboto"; }
  .note h4 { font: 700 30px/1.1 "Roboto"; color: var(--ink); }
  .note p { font: 500 25px/1.2 "Roboto"; color: var(--slate); margin-top: 4px; }

  /* S15: past due */
  #stamp { position: absolute; left: 960px; top: 360px; transform: translate(-50%, -50%) rotate(-12deg); padding: 18px 44px;
           border: 12px solid var(--red); border-radius: 22px; color: var(--red); font: 900 150px/1 "Roboto"; letter-spacing: 0.04em;
           background: rgba(255,255,255,0.12); text-shadow: 0 4px 18px rgba(0,0,0,0.25); white-space: nowrap; }

  /* S16: what it costs */
  #scrim { position: absolute; inset: 0; background: rgba(8, 12, 20, 0.58); }
  .word { position: absolute; left: 0; right: 0; text-align: center; font: 900 116px/1 "Roboto"; letter-spacing: -0.01em; color: #fff;
          text-shadow: 0 6px 30px rgba(0,0,0,0.45); }

  /* S17: the forgotten message */
  #msg { position: absolute; left: 960px; top: 330px; transform: translate(-50%, -50%); width: 1180px; height: 230px; border-radius: 30px;
         background: rgba(255,255,255,0.97); box-shadow: 0 24px 60px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 40px; padding: 0 50px; }
  #radio { position: relative; width: 130px; height: 130px; flex: none; }
  #radio .core { position: absolute; inset: 22px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; }
  #radio .ring { position: absolute; inset: 22px; border-radius: 50%; border: 6px solid var(--red); }
  #msg .txt { position: relative; height: 92px; flex: 1; }
  #msg .txt div { position: absolute; left: 0; top: 0; font: 900 80px/92px "Roboto"; color: var(--red); white-space: nowrap; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(230,35,36,0) 45%, rgba(230,35,36,0.42) 100%); }
</style>
</head>
<body>
<div id="pv"></div>

<div class="scene" id="s14"></div>

<div class="scene" id="s15"><div id="stamp">PAST DUE</div></div>

<div class="scene" id="s16">
  <div id="scrim"></div>
  <div class="word" id="w1" style="top: 190px">MISSED DEADLINES</div>
  <div class="word" id="w2" style="top: 340px">COST OVERRUNS</div>
  <div class="word" id="w3" style="top: 490px; color: #ff6a5c">SAFETY CONCERNS</div>
</div>

<div class="scene" id="s17">
  <div id="vig"></div>
  <div id="msg">
    <div id="radio"><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
      <div class="core"><svg width="46" height="62" viewBox="0 0 46 62"><rect x="8" y="14" width="30" height="46" rx="6" fill="#fff"/><rect x="28" y="0" width="5" height="18" rx="2.5" fill="#fff"/><rect x="14" y="22" width="18" height="10" rx="2" fill="#e62324"/></svg></div></div>
    <div class="txt"><div id="m1">MESSAGE MISSED</div><div id="m2">NO ONE MONITORING</div></div>
  </div>
</div>

<script src="../shared/gsap.min.js"></script>
<script src="../shared/motion.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has("preview")) document.documentElement.classList.add("preview"), document.body.classList.add("preview");
  const SCENE = q.get("scene") || "14";
  // scene lengths from data/scenes_working_2026-11-19.json, plus a little so each clip covers its scene
  const LEN = { 14: 6.27, 15: 13.38, 16: 16.23, 17: 15.12 };
  const D = LEN[SCENE] + 0.05;
  document.getElementById(`s${SCENE}`).style.display = "block";
  const tl = gsap.timeline({ paused: true });

  if (SCENE === "14") {
    // "calendar apps and lists help us" (0.49 / 0.79 / 1.33 / 1.63), "but" at 2.33
    const NOTES = [["#2c7ef4", "31", "Calendar", "Dentist, 3:00 PM"], ["#f2a93b", "!", "Reminder", "Pick up the dry cleaning"],
                   ["#22a35a", "✓", "To-do", "Pay the electric bill"], ["#2c7ef4", "31", "Calendar", "Soccer practice, 5:30 PM"]];
    const host = document.getElementById("s14");
    NOTES.forEach(([c, g, h, p], i) => {
      const d = document.createElement("div"); d.className = "note"; d.style.top = `${110 + i * 128}px`;
      d.innerHTML = `<div class="ic" style="background:${c}">${g}</div><div><h4>${h}</h4><p>${p}</p></div>`;
      host.appendChild(d);
      const t = [0.4, 0.74, 1.28, 1.58][i];
      tl.fromTo(d, { opacity: 0, x: 140, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t);
      tl.to(d, { opacity: 0, x: 120, duration: 0.25, ease: "power2.in" }, 2.2 + i * 0.05);
    });
  }

  if (SCENE === "15") {
    // "pay late fees on forgotten bills": slams on "late" (3.60), gone as "apologize" starts (5.40)
    tl.fromTo("#stamp", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, 3.52);
    tl.fromTo("#stamp", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 3.74);
    tl.to("#stamp", { opacity: 0, duration: 0.2 }, 5.3);
  }

  if (SCENE === "16") {
    // the footage darkens at "will cause" (8.98), then "missed deadlines" 10.06, "cost overruns" 11.46, "safety concerns" 14.12
    tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.0);
    [["#w1", 10.0], ["#w2", 11.4], ["#w3", 14.05]].forEach(([s, t]) =>
      tl.fromTo(s, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, t));
  }

  if (SCENE === "17") {
    // "a forgotten message" 8.17, "failure to monitor" 9.37 / 9.89, out before "deadly consequences" 12.03
    gsap.set(["#msg", "#m2", "#vig"], { opacity: 0 });
    tl.fromTo("#msg", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 8.05);
    [["#r1", 0], ["#r2", 0.45]].forEach(([s, d]) =>
      tl.fromTo(s, { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "power1.out", repeat: 2 }, 8.2 + d));
    tl.to("#m1", { opacity: 0, y: -40, duration: 0.2 }, 9.75);
    tl.fromTo("#m2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 9.82);
    tl.to("#msg", { opacity: 0, scale: 0.9, duration: 0.3 }, 11.0);
    tl.fromTo("#vig", { opacity: 0 }, { opacity: 1, duration: 0.6, yoyo: true, repeat: 1, repeatDelay: 1.0 }, 12.0);
  }

  M.register(tl, { duration: D, width: 1920, height: 1080 });
</script>
</body>
</html>
