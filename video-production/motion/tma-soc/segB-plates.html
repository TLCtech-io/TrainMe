<!doctype html>
<!-- IMP - Span of Control, segment B: the illustrated plate spinner for scenes 21, 22 and 24 (scene 23 is the AI cruise
     ship). ?scene=21|22|24 picks the scene; each clip is its scene's length. A "What makes it harder?" row ties the
     scenes together: 1 more distance, 2 mixed plates, 3 a moving stage (scene 23), 4 fragile and costly.
     Times are seconds from each scene's start, from Rick's words (whisper, 2026-11-19). ?preview adds the caption gradient. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../shared/tma.css" />
<style>
  html, body { background: #070d22; }
  #sky { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1b2d63 0%, #0d1838 45%, #060b1d 80%); }
  #spot { position: absolute; left: 360px; top: -120px; width: 1200px; height: 900px; background: radial-gradient(ellipse at 50% 0%, rgba(255,236,190,0.28), rgba(255,236,190,0) 65%); }
  #floor { position: absolute; left: 0; right: 0; top: 640px; height: 440px; background: linear-gradient(180deg, #3a2a20, #1c140f 40%, #0c0907); }
  #floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #c9a35c; opacity: 0.6; }
  #stage { position: absolute; inset: 0; transform-origin: 960px 640px; }
  .pole { position: absolute; top: 340px; width: 8px; height: 300px; margin-left: -4px; border-radius: 4px; background: linear-gradient(90deg, #c8b48a, #8b7550); }
  .plate { position: absolute; top: 330px; transform-origin: 50% 50%; }
  .plate svg { display: block; overflow: visible; }
  .tag { position: absolute; top: 420px; margin-left: -70px; width: 140px; text-align: center; font: 900 40px/56px "Roboto"; color: var(--ink);
         background: #fff3cf; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
  #kick { position: absolute; left: 120px; top: 64px; font: 900 32px/1 "Roboto"; letter-spacing: 0.16em; color: var(--amber); }
  #chips { position: absolute; left: 120px; top: 112px; display: flex; gap: 16px; }
  .chip2 { height: 60px; padding: 0 24px; border-radius: 30px; border: 3px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.55);
           font: 800 28px/54px "Roboto"; white-space: nowrap; }
  .chip2 b { color: inherit; margin-right: 10px; }
  .chip2.on { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  #big { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font: 900 78px/1 "Roboto"; color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #arrow { position: absolute; top: 560px; height: 10px; background: var(--amber); border-radius: 5px; }
  #arrow::before, #arrow::after { content: ""; position: absolute; top: -12px; border: 17px solid transparent; }
  #arrow::before { left: -20px; border-right: 22px solid var(--amber); border-left: 0; }
  #arrow::after { right: -20px; border-left: 22px solid var(--amber); border-right: 0; }
  #crowd { position: absolute; left: 0; right: 0; top: 650px; height: 120px; }
  .head { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: #05070f; }
  .head i { position: absolute; left: -10px; top: 60px; width: 94px; height: 80px; border-radius: 40px 40px 0 0; background: #05070f; }
  .gasp { position: absolute; font: 900 54px/1 "Roboto"; color: var(--amber); }
  #pv { position: absolute; inset: 0; display: none; background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,0.78) 100%); }
  .preview #pv { display: block; }
</style>
</head>
<body>
<div id="sky"></div><div id="spot"></div><div id="floor"></div>
<div id="stage"></div>
<div id="crowd"></div>
<div id="kick">WHAT MAKES IT HARDER?</div>
<div id="chips">
  <div class="chip2" id="ch1"><b>1</b>More distance</div>
  <div class="chip2" id="ch2"><b>2</b>Mixed plates</div>
  <div class="chip2" id="ch3"><b>3</b>A moving stage</div>
  <div class="chip2" id="ch4"><b>4</b>Fragile and costly</div>
</div>
<div id="big"></div>
<div id="pv"></div>

<script src="../shared/gsap.min.js"></script>
<script src="../shared/motion.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has("preview")) document.documentElement.classList.add("preview");
  const SCENE = q.get("scene") || "21";
  const LEN = { 21: 6.39, 22: 6.42, 24: 12.59 };
  const D = LEN[SCENE] + 0.05;
  const stage = document.getElementById("stage");
  const N = 5;

  // ---- plates: an ellipse with a rim, and a highlight that sweeps to read as spinning
  const plateSVG = (w, kind) => {
    const h = Math.round(w * 0.24);
    if (kind === "ball") return `<svg width="${w}" height="${w}" viewBox="0 0 ${w} ${w}"><circle cx="${w/2}" cy="${w/2}" r="${w/2}" fill="#1b1d24"/>
      <circle cx="${w*0.38}" cy="${w*0.3}" r="${w*0.07}" fill="#3a3e4a"/><circle cx="${w*0.55}" cy="${w*0.28}" r="${w*0.06}" fill="#3a3e4a"/><circle cx="${w*0.46}" cy="${w*0.44}" r="${w*0.06}" fill="#3a3e4a"/></svg>`;
    const rim = kind === "china" ? `<ellipse cx="${w/2}" cy="${h/2}" rx="${w*0.40}" ry="${h*0.36}" fill="none" stroke="#1f4fae" stroke-width="${Math.max(5, w*0.05)}" stroke-dasharray="10 6"/><ellipse cx="${w/2}" cy="${h/2}" rx="${w*0.25}" ry="${h*0.22}" fill="none" stroke="#1f4fae" stroke-width="3"/>` : "";
    const edge = kind === "china" ? "#d4a640" : "#c9ced8";
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-3}" ry="${h/2-3}" fill="#fbfbfd" stroke="${edge}" stroke-width="${kind === "china" ? 7 : 4}"/>
      ${rim}<ellipse class="hl" cx="${w/2}" cy="${h*0.42}" rx="${w*0.12}" ry="${h*0.18}" fill="#ffffff" opacity="0.95"/></svg>`;
  };
  const poles = [], plates = [];
  for (let i = 0; i < N; i++) {
    const p = document.createElement("div"); p.className = "pole"; stage.appendChild(p); poles.push(p);
    const pl = document.createElement("div"); pl.className = "plate"; stage.appendChild(pl); plates.push({ el: pl, w: 130, kind: "plate" });
  }
  const setPlate = (i, w, kind) => { plates[i].w = w; plates[i].kind = kind; plates[i].el.innerHTML = plateSVG(w, kind); };
  for (let i = 0; i < N; i++) setPlate(i, 130, "plate");

  // ---- the performer: a flat figure with a run cycle
  const perf = document.createElement("div");
  perf.style.cssText = "position:absolute;top:420px;width:120px;height:230px;margin-left:-60px;";
  perf.innerHTML = `<svg width="120" height="230" viewBox="0 0 120 230" style="overflow:visible">
    <g id="legL" transform="translate(52,150)"><rect x="-9" y="0" width="18" height="78" rx="8" fill="#111"/></g>
    <g id="legR" transform="translate(68,150)"><rect x="-9" y="0" width="18" height="78" rx="8" fill="#111"/></g>
    <rect x="30" y="58" width="60" height="100" rx="22" fill="#14161c"/>
    <path d="M60 60 L48 60 L60 112 L72 60 Z" fill="#f4f4f6"/><rect x="53" y="62" width="14" height="8" rx="3" fill="#e62324"/>
    <g id="armL" transform="translate(36,70)"><rect x="-8" y="0" width="16" height="70" rx="8" fill="#14161c"/></g>
    <g id="armR" transform="translate(84,70)"><rect x="-8" y="0" width="16" height="70" rx="8" fill="#14161c"/></g>
    <circle cx="60" cy="34" r="26" fill="#e8b48f"/><path d="M34 30 Q40 6 62 8 Q84 8 86 30 Q74 18 60 20 Q44 20 34 30 Z" fill="#1d1712"/></svg>`;
  stage.appendChild(perf);
  const legL = perf.querySelector("#legL"), legR = perf.querySelector("#legR"), armL = perf.querySelector("#armL"), armR = perf.querySelector("#armR");

  let spacing = 150, perfX = 960, running = 0, wobble = 1, crack = -1;
  const layout = () => {
    for (let i = 0; i < N; i++) {
      const x = 960 + (i - 2) * spacing;
      poles[i].style.left = `${x}px`;
      const pl = plates[i], w = pl.w, h = pl.kind === "ball" ? w : Math.round(w * 0.24);
      pl.el.style.left = `${x - w / 2}px`; pl.el.style.top = `${(pl.kind === "ball" ? 332 : 330) - h / 2}px`;
    }
    perf.style.left = `${perfX}px`;
  };

  const tl = gsap.timeline({ paused: true });
  const big = document.getElementById("big");
  const says = (text, t, out) => {
    const el = document.createElement("div"); el.className = "bigw"; el.textContent = text;
    el.style.cssText = "position:absolute;left:0;right:0;top:0;text-align:center;opacity:0"; big.appendChild(el);
    tl.fromTo(el, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, t);
    if (out) tl.to(el, { opacity: 0, duration: 0.2 }, out);
  };
  const chipOn = (id, t) => tl.call(() => document.getElementById(id).classList.add("on"), null, t)
                              .fromTo(`#${id}`, { scale: 1 }, { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, t);
  const st = { spacing: 150, perfX: 900, running: 0, wobble: 1, zoom: 1 };
  let keysX = [[0, 900]], keysRun = [[0, 0]];

  if (SCENE === "21") {
    // "what would make Eric's trick even more difficult?" ... "if the distance between sticks was increased" (3.56)
    tl.fromTo("#stage", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo(["#kick", "#chips"], { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power3.out" }, 0.3);
    chipOn("ch1", 3.5);
    tl.to(st, { spacing: 390, duration: 0.9, ease: "power3.inOut" }, 3.5);
    tl.to("#stage", { scale: 0.8, duration: 0.9, ease: "power3.inOut" }, 3.5);
    says("MORE DISTANCE", 3.6);
    const arrow = document.createElement("div"); arrow.id = "arrow"; stage.appendChild(arrow);
    gsap.set(arrow, { opacity: 0 });
    tl.fromTo(arrow, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 4.2);
    keysX = [[0, 900], [1.2, 900], [1.8, 1050], [2.6, 1110], [3.5, 960], [4.5, 960 - 2 * 390], [5.4, 960 + 2 * 390], [6.4, 960 - 390]];
    keysRun = [[0, 0.3], [3.4, 0.6], [3.7, 1.6], [6.5, 1.6]];
    window.__arrow = arrow;
  }
  if (SCENE === "22") {
    // "plates were all different sizes" (0.89) "or weights" (1.95) "different techniques" (3.01)
    gsap.set(["#kick", "#chips"], { opacity: 1 });
    document.getElementById("ch1").classList.add("on");
    st.spacing = 300; st.zoom = 1.0;
    chipOn("ch2", 0.85);
    const sizes = [90, 190, 120, 230, 105];
    tl.call(() => sizes.forEach((w, i) => setPlate(i, w, "plate")), null, 0.85);
    tl.fromTo(".plate", { scale: 0.4 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)", stagger: 0.05, immediateRender: false }, 0.86);
    tl.call(() => setPlate(3, 116, "ball"), null, 1.95);
    const lb = document.createElement("div"); lb.className = "tag"; lb.textContent = "16 LB"; lb.style.top = "306px"; lb.style.left = `${960 + 300 + 150}px`;
    stage.appendChild(lb); gsap.set(lb, { opacity: 0 });
    tl.fromTo(lb, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 2.05);
    tl.fromTo(".plate:nth-of-type(8)", { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, 1.96);
    says("DIFFERENT SIZES & WEIGHTS", 0.95);
    keysX = [[0, 960 - 600], [1.0, 960 - 600], [2.0, 960 - 300], [3.0, 960 + 300], [4.0, 960], [5.0, 960 + 600], [6.4, 960 - 300]];
    keysRun = [[0, 0.6], [2.8, 1.2], [6.5, 1.4]];
    st.wobble = 1.6;
  }
  if (SCENE === "24") {
    // "fine china plates spinning" (3.65) "consequences of mistake" (5.95) "fragility" (9.13) "the cost of the plates" (10.57)
    gsap.set(["#kick", "#chips"], { opacity: 1 });
    ["ch1", "ch2", "ch3"].forEach((c) => document.getElementById(c).classList.add("on"));
    st.spacing = 300; st.zoom = 1.0;
    chipOn("ch4", 3.6);
    tl.call(() => { for (let i = 0; i < N; i++) setPlate(i, 190, "china"); }, null, 3.6);
    tl.fromTo(".plate", { scale: 1.5, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.06, immediateRender: false }, 3.62);
    says("FINE CHINA", 3.7, 5.8);
    // the crowd and their gasps on "consequences"
    const crowd = document.getElementById("crowd");
    for (let k = 0; k < 16; k++) { const h = document.createElement("div"); h.className = "head"; h.style.left = `${40 + k * 118 + (k % 2) * 30}px`; h.style.top = `${(k % 3) * 10}px`; h.innerHTML = "<i></i>"; crowd.appendChild(h); }
    tl.fromTo("#crowd", { y: 120 }, { y: 0, duration: 0.5, ease: "power3.out" }, 2.8);
    [3, 7, 11, 14].forEach((k, j) => {
      const g = document.createElement("div"); g.className = "gasp"; g.textContent = "!"; g.style.left = `${70 + k * 118 + (k % 2) * 30}px`; g.style.top = "590px"; document.body.appendChild(g);
      tl.fromTo(g, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(3)" }, 5.95 + j * 0.12);
      tl.to(g, { opacity: 0, duration: 0.3 }, 8.6);
    });
    says("ONE MISTAKE COSTS MORE", 6.0, 8.9);
    tl.call(() => { crack = 1; }, null, 9.1);
    tl.call(() => { crack = -1; }, null, 9.9);
    says("FRAGILE", 9.15, 10.5);
    ["$450", "$1,200", "$2,800", "$950", "$3,100"].forEach((p, i) => {
      const t = document.createElement("div"); t.className = "tag"; t.textContent = p; stage.appendChild(t); t.dataset.i = i; gsap.set(t, { opacity: 0 });
      tl.fromTo(t, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 10.5 + i * 0.12);
      window.__tags = (window.__tags || []).concat(t);
    });
    says("COSTLY", 10.6);
    keysX = [[0, 960 - 300], [2.0, 960 + 300], [4.0, 960 - 600], [6.2, 960 + 150], [8.0, 960 - 150], [10.0, 960 + 600], [12.6, 960]];
    keysRun = [[0, 0.8], [6.0, 1.4], [12.6, 1.4]];
    st.wobble = 1.0;
    tl.to(st, { wobble: 3.2, duration: 0.6 }, 5.9);
  }
  gsap.set(big, { opacity: 1 });

  M.register(tl, { duration: D, width: 1920, height: 1080 }, (t) => {
    spacing = st.spacing; perfX = M.keys(keysX, t);
    const run = M.keys(keysRun, t);
    if (SCENE !== "21") stage.style.transform = `scale(${st.zoom})`;
    layout();
    // run cycle
    const ph = t * 11 * Math.max(0.4, run);
    legL.setAttribute("transform", `translate(52,150) rotate(${Math.sin(ph) * 28 * Math.min(1, run)})`);
    legR.setAttribute("transform", `translate(68,150) rotate(${-Math.sin(ph) * 28 * Math.min(1, run)})`);
    armL.setAttribute("transform", `translate(36,70) rotate(${150 + Math.sin(ph * 0.5) * 20})`);
    armR.setAttribute("transform", `translate(84,70) rotate(${-150 - Math.cos(ph * 0.5) * 20})`);
    // spinning plates: the highlight sweeps, the plate wobbles
    plates.forEach((p, i) => {
      const hl = p.el.querySelector(".hl");
      if (hl) hl.setAttribute("cx", String(p.w / 2 + Math.sin(t * 9 + i * 1.7) * p.w * 0.3));
      const wob = Math.sin(t * 3.2 + i * 2.1) * 3 * st.wobble * (p.kind === "ball" ? 2.2 : 1);
      p.el.style.transform = `rotate(${wob}deg)` + (crack === i ? ` translateX(${Math.sin(t * 60) * 4}px)` : "");
    });
    if (window.__arrow) { const a = window.__arrow; a.style.left = `${960 - spacing + 20}px`; a.style.width = `${spacing - 40}px`; }
    if (window.__tags) window.__tags.forEach((g) => { g.style.left = `${960 + (g.dataset.i - 2) * spacing}px`; });
  });
</script>
</body>
</html>
