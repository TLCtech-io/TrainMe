<!doctype html>
<!-- IMP - Span of Control, scenes 19 and 20 (WORKING 159.39 to 190.34): Erich Brenn's plate spinning, from the user's
     allowable-use GIF (src/brenn.gif, 5.07 s, 480x352, 15 fps; frames extracted to src/brenn/, not in git).
     One master timeline (0 = 159.39 s); build_s19_20.sh cuts it at the scene break (18.22) into one clip per scene.
     The GIF plays inside a vintage TV over a blurred copy of itself; each beat shows a different part of it.
     ?preview adds a stand-in caption gradient for stills. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../shared/tma.css" />
<style>
  html, body { background: #0b1230; }
  #bgwrap img { position: absolute; left: -60px; top: -60px; width: 2040px; height: 1200px; object-fit: cover; filter: blur(18px); opacity: 0.75; display: none; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(8,14,40,0.35), rgba(5,8,22,0.85)); }
  #tv { position: absolute; left: 960px; top: 400px; width: 990px; height: 700px; margin: -350px 0 0 -495px; transform-origin: 50% 50%; }
  #bezel { position: absolute; inset: 0; border-radius: 54px; background: linear-gradient(160deg, #3a3d46, #1d1f25 70%);
           box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.12); }
  #screen { position: absolute; left: 50px; top: 46px; width: 830px; height: 608px; border-radius: 40px; overflow: hidden; background: #000; }
  #gifwrap { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #gifwrap img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 2px, rgba(0,0,0,0) 2px 5px); mix-blend-mode: multiply; }
  #glare { position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 38%); }
  .knob { position: absolute; right: 22px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8a8f99, #2a2d33); }
  #kick { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); background: var(--amber); color: var(--ink); border-radius: 14px;
          padding: 14px 26px 12px; font: 900 32px/1 "Roboto"; letter-spacing: 0.16em; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  #tag { position: absolute; left: 22px; top: -34px; background: var(--blue); color: #fff; border-radius: 14px; padding: 14px 24px 12px;
         box-shadow: 0 10px 30px rgba(0,0,0,0.35); white-space: nowrap; }
  #tag b { display: block; font: 900 46px/1 "Roboto"; }
  #tag span { display: block; font: 600 27px/1 "Roboto"; margin-top: 8px; opacity: 0.95; }
  #sticker { position: absolute; left: 1230px; top: 120px; transform: rotate(10deg); background: var(--amber); color: var(--ink); border-radius: 18px;
             padding: 16px 28px; font: 900 64px/1 "Roboto"; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  .big { position: absolute; left: 1080px; color: #fff; font: 900 64px/1.05 "Roboto"; text-shadow: 0 6px 24px rgba(0,0,0,0.5); white-space: nowrap; }
  #half { font-size: 170px; color: var(--amber); }
  #counter { position: absolute; left: 1250px; top: 170px; width: 520px; text-align: center; }
  #counter .lab { font: 900 30px/1 "Roboto"; letter-spacing: 0.18em; color: var(--amber); }
  #counter .num { font: 900 230px/1 "Roboto"; color: #fff; text-shadow: 0 8px 30px rgba(0,0,0,0.5); margin-top: 10px; }
  #ctrl { position: absolute; left: 1290px; top: 520px; width: 440px; height: 84px; border-radius: 42px; background: #22a35a; color: #fff;
          font: 900 40px/84px "Roboto"; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  #ctrl span { position: absolute; left: 0; right: 0; top: 0; }
  #plus { position: absolute; left: 1650px; top: 300px; font: 900 110px/1 "Roboto"; color: var(--amber); text-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #pv { position: absolute; inset: 0; display: none; background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,0.78) 100%); }
  #pv div { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font: 500 46px/1.2 "Roboto"; color: #fff; }
  .preview #pv { display: block; }
</style>
</head>
<body>
<div id="bgwrap"></div>
<div id="shade"></div>
<div id="tv">
  <div id="bezel"></div>
  <div id="screen"><div id="gifwrap"></div><div id="scan"></div><div id="glare"></div></div>
  <div class="knob" style="top: 250px"></div><div class="knob" style="top: 310px"></div>
  <div id="kick">THE ED SULLIVAN SHOW</div>
  <div id="tag"><b>Erich Brenn</b><span>on The Ed Sullivan Show</span></div>
</div>
<div id="sticker">NO CGI</div>
<div class="big" id="most" style="top: 250px">Most of us can't manage</div>
<div class="big" id="half" style="top: 330px">even half.</div>
<div id="counter"><div class="lab">PLATES SPINNING</div><div class="num" id="num">0</div></div>
<div id="ctrl"><span id="c1">IN CONTROL ✓</span><span id="c2">NOT FOR LONG</span></div>
<div id="plus">+1</div>
<div id="pv"><div>a sample caption sits here, over the gradient</div></div>

<script src="../shared/gsap.min.js"></script>
<script src="../shared/motion.js"></script>
<script>
  if (location.search.includes("preview")) document.documentElement.classList.add("preview");
  const D = 31.00;   // scene 19: 0 to 18.22; scene 20: 18.22 to 30.95
  // GIF parts (seconds in the GIF): tray close-up 0-0.95, wide with tray 0.95-2.45, bowl close-up 2.45-3.45, running between poles 3.45-5.07
  // Beats (master seconds, from Rick's words): [start, gif from, gif to (loops in that range), speed, zoom, zoom centre x%, y%]
  const BEATS = [
    [0.00, 0.00, 2.45, 1.0, 1.00, 50, 50],   // "This great video from the old Ed Sullivan show"
    [3.70, 3.45, 5.07, 1.0, 1.00, 50, 50],   // "shows what we really mean..."
    [6.90, 2.45, 3.45, 0.5, 1.10, 50, 45],   // "plates spinning at the end of sticks": the bowl, slowed
    [9.25, 0.00, 0.95, 1.0, 1.00, 50, 50],   // "Guy really did that"
    [10.80, 3.45, 5.07, 1.0, 1.55, 58, 62],  // "you can see how difficult it was": punch in on him running
    [14.40, 0.95, 2.45, 1.0, 1.00, 50, 50],  // "brilliant ... most of us can't manage even half"
    [18.22, 0.00, 0.95, 1.0, 1.15, 50, 40],  // scene 20, "like the great Erich Brenn": on his face
    [20.45, 0.95, 2.45, 1.0, 1.00, 50, 50],  // "see how many plates we can keep spinning"
    [23.45, 3.45, 5.07, 1.3, 1.35, 55, 62],  // "we scramble from stick to stick": faster, closer
    [26.23, 2.45, 3.45, 0.6, 1.10, 50, 45],  // "as soon as we think we're in control"
    [28.30, 3.45, 5.07, 1.0, 1.00, 50, 50],  // "we start spinning another one on another stick"
  ];
  // all 76 frames preloaded and stacked; one is shown at a time
  const gifwrap = document.getElementById("gifwrap"), bgwrap = document.getElementById("bgwrap");
  const FR = [], BG = [];
  for (let i = 0; i < 76; i++) {
    const n = String(i).padStart(3, "0");
    const a = new Image(); a.src = `src/brenn/f_${n}.jpg`; gifwrap.appendChild(a); FR.push(a);
    const b = new Image(); b.src = `src/brenn/b_${n}.jpg`; bgwrap.appendChild(b); BG.push(b);
  }
  let last = -1;
  function frameAt(t) {
    let b = BEATS[0];
    for (const x of BEATS) if (t >= x[0]) b = x;
    const [t0, g0, g1, sp, z, cx, cy] = b;
    const span = g1 - g0, g = g0 + (((t - t0) * sp) % span);
    const f = Math.min(75, Math.floor(g * 15));
    if (f !== last) {
      if (last >= 0) { FR[last].style.display = "none"; BG[last].style.display = "none"; }
      FR[f].style.display = "block"; BG[f].style.display = "block"; last = f;
    }
    gifwrap.style.transformOrigin = `${cx}% ${cy}%`;
    gifwrap.style.transform = `scale(${z})`;
  }

  const tl = gsap.timeline({ paused: true });
  gsap.set(["#kick", "#tag", "#sticker", "#most", "#half", "#counter", "#ctrl", "#plus", "#c2"], { opacity: 0 });
  tl.fromTo("#tv", { opacity: 0, scale: 0.75, rotation: -3 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.05);
  tl.fromTo("#kick", { opacity: 0, y: -20, xPercent: -50 }, { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "back.out(1.8)" }, 2.95);
  tl.to("#kick", { opacity: 0, duration: 0.3 }, 9.1);
  // "Guy really did that"
  tl.fromTo("#sticker", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.in" }, 9.35);
  tl.to("#sticker", { opacity: 0, scale: 0.8, duration: 0.25 }, 11.4);
  // "most of us can't manage even half that number": the TV slides left, the words land on the right
  tl.to("#tv", { x: -400, scale: 0.72, duration: 0.6, ease: "power3.inOut" }, 14.4);
  tl.fromTo("#most", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 14.95);
  tl.fromTo("#half", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", transformOrigin: "0% 60%" }, 16.7);
  // scene 20: back to centre for the name
  tl.to(["#most", "#half"], { opacity: 0, duration: 0.25 }, 18.05);
  tl.to("#tv", { x: 0, scale: 1, duration: 0.5, ease: "power3.inOut" }, 18.1);
  tl.fromTo("#tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 18.8);
  // "see how many plates we can keep spinning": TV left again, the counter on the right
  tl.to("#tv", { x: -400, scale: 0.72, duration: 0.6, ease: "power3.inOut" }, 20.4);
  tl.to("#tag", { opacity: 0, duration: 0.3 }, 20.4);
  tl.fromTo("#counter", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 20.75);
  // "as soon as we think we're in control" (27.37) ... "another one" (28.39)
  tl.fromTo("#ctrl", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 27.3);
  tl.to("#ctrl", { backgroundColor: "#e62324", duration: 0.2 }, 28.3);
  tl.to("#c1", { opacity: 0, duration: 0.15 }, 28.3);
  tl.to("#c2", { opacity: 1, duration: 0.15 }, 28.38);
  tl.fromTo("#plus", { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 28.35);
  tl.to("#plus", { opacity: 0, y: -40, duration: 0.4 }, 29.6);

  const num = document.getElementById("num");
  Promise.all([...FR, ...BG].map((im) => im.decode().catch(() => {}))).then(() => M.register(tl, { duration: D, width: 1920, height: 1080 }, (t) => {
    frameAt(t);
    // plates spinning: 1 to 7 while Rick lists them (21.2 to 26.0), then one more on "another one"
    const n = t < 28.39 ? Math.round(M.keys([[21.0, 1], [26.0, 7]], t)) : 8;
    num.textContent = n;
  }));
</script>
</body>
</html>
