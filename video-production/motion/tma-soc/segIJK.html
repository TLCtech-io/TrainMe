<!doctype html>
<!-- IMP - Span of Control, segments I to K (scenes 77, 78, 81 and 82 to 90). ?scene=N picks the scene.
     Scene 81 is placed from 0.79 s (when pilot 4 fades out). Parts of 82, 84, 87, 89, 90 sit on Descript stock as transparent overlays;
     the build script renders each part with --from/--to. Times are seconds from each scene's start (whisper words). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../shared/tma.css" />
<link rel="stylesheet" href="lib/page.css" />
<style>
  .ochip { position: absolute; height: 76px; padding: 0 30px; border-radius: 38px; font: 900 40px/76px Roboto; color: #fff; white-space: nowrap;
           box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
  .sheet { position: absolute; left: 460px; top: 200px; width: 1000px; border-radius: 28px; background: #fff; box-shadow: var(--shadow); padding: 26px 40px; }
  .sheet .r { display: flex; align-items: center; height: 92px; border-bottom: 3px solid var(--faint); font: 700 44px/1 Roboto; }
  .sheet .r:last-child { border-bottom: 0; }
  .sheet .r b { width: 440px; color: var(--ink); }
  .sheet .r i { font-style: normal; color: var(--slate); margin: 0 26px; }
  .sheet .r span { color: var(--blue); font-weight: 900; }
  .meter { position: absolute; width: 300px; height: 22px; border-radius: 11px; background: var(--faint); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; transform: scaleX(0); }
  .mlab { position: absolute; width: 300px; font: 700 22px/1 Roboto; color: var(--slate); letter-spacing: 0.08em; }
  .p14 { position: absolute; width: 270px; height: 96px; border-radius: 16px; background: #fff; box-shadow: var(--shadow); border: 4px solid var(--faint);
         display: flex; align-items: center; justify-content: center; text-align: center; font: 700 22px/1.15 Roboto; color: var(--ink); padding: 0 12px; }
  .tcard { position: absolute; width: 220px; height: 64px; border-radius: 10px; font: 900 26px/64px Roboto; text-align: center; color: var(--ink); box-shadow: var(--shadow); }
  .q { position: absolute; left: 300px; width: 1320px; height: 140px; border-radius: 28px; background: #fff; box-shadow: var(--shadow);
       display: flex; align-items: center; gap: 30px; padding: 0 40px; font: 900 50px/1.1 Roboto; color: var(--ink); }
  .q b { width: 76px; height: 76px; border-radius: 50%; background: var(--blue); color: #fff; font: 900 44px/76px Roboto; text-align: center; flex: none; }
  .drawer { position: absolute; width: 330px; height: 120px; border-radius: 18px; background: #fff; box-shadow: 0 16px 36px rgba(29,38,51,0.18);
            border: 5px solid var(--blue); display: flex; align-items: center; justify-content: center; font: 900 36px/1 Roboto; color: var(--ink); }
  .drawer::before { content: ""; position: absolute; top: -34px; left: calc(50% - 10px); width: 20px; height: 34px; border-radius: 6px; background: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<div id="pv"></div>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/motion.js"></script>
<script src="lib/kit.js"></script>
<script>
window.SCENE_LEN = { 77: 8.36, 78: 12.86, 81: 21.56, 82: 35.94, 83: 10.58, 84: 13.64, 85: 15.21, 86: 9.11, 87: 15.26, 88: 15.23, 89: 24.56, 90: 12.90 };
const PART = KIT.q.get("part") || "";
const CLOCK = `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="#fff" stroke="#1d2633" stroke-width="8"/><g id="hands"><path id="hh" d="M60 60 V30" stroke="#1d2633" stroke-width="8" stroke-linecap="round"/><path id="mh" d="M60 60 L84 60" stroke="#e62324" stroke-width="6" stroke-linecap="round"/></g><circle cx="60" cy="60" r="6" fill="#1d2633"/></svg>`;
const CHEV = `<svg width="46" height="44" viewBox="0 0 46 44"><path d="M4 18 L23 4 L42 18" fill="none" stroke="#ffcb73" stroke-width="7" stroke-linejoin="round"/><path d="M4 36 L23 22 L42 36" fill="none" stroke="#ffcb73" stroke-width="7" stroke-linejoin="round"/></svg>`;

KIT.start((K) => {
  const { tl, el } = K;
  const center = (n) => Object.assign(n.style, { left: "0", right: "0", margin: "0 auto", width: "fit-content" });

  if (K.SCENE === 77) {
    // "how do you keep all these names (1.97) and titles straight (2.49 / 2.73)? Delegating your authority (3.77 / 4.41) is another way to maintain your span of control (7.29)"
    const sh = el("sheet", {}, [["Section", "Chief"], ["Branch", "Director"], ["Division / Group", "Supervisor"], ["Unit", "Leader"]].map(([a, b]) => `<div class="r"><b>${a}</b><i>→</i><span>${b}</span></div>`).join(""));
    const k = el("kicker", { left: "460px", top: "130px", fontSize: "28px" }, `<span class="bar"></span>Who's in charge of what`);
    K.fadeIn(k, 0.75); K.pop(sh, 0.8, 0.8);
    [...sh.querySelectorAll(".r")].forEach((r, i) => K.slide(r, 1.0 + i * 0.35, 60));
    tl.to([sh, k], { x: -1300, opacity: 0, duration: 0.5, ease: "power3.in" }, 3.6);
    K.header("Span of control", "Delegate your authority", 3.85, 1.0);
    const c = K.chip("Another way to keep your span manageable", 0, 0, "var(--blue)", "#fff", 40); center(c); c.style.top = "420px"; K.rise(c, 5.5, 20);
  }

  if (K.SCENE === 78) {
    // "You can have deputies (0.75). For example, the incident commander (3.03 / 3.35) can have a deputy incident commander (4.43 / 5.17) in case something happens (6.01 / 6.35)
    //  ... more likely the IC gets dragged (9.79) into a meeting (10.55) that's going to last for an hour (11.83)"
    K.header("Delegation", "Deputies", 0.6, 1.0);
    K.box("ic", 960, 330, "Incident Commander", "ic", 420, 90, 34); K.pop(K.boxes.ic, 2.95, 0.7);
    const dep = K.box("dep", 960, 520, "Deputy Incident Commander", "sup", 520, 90, 32);
    K.hide(dep); tl.fromTo(dep, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, 4.4);
    const dl = el("", { position: "absolute", left: "957px", top: "375px", width: "6px", height: "100px", background: "repeating-linear-gradient(180deg, var(--line) 0 12px, transparent 12px 22px)" });
    K.fadeIn(dl, 4.6, 0.2);
    const bang = el("", { position: "absolute", left: "1180px", top: "270px", width: "80px", height: "80px", borderRadius: "50%", background: "var(--red)", color: "#fff", font: "900 56px/80px Roboto", textAlign: "center" }, "!");
    K.pop(bang, 6.0, 0.3, "back.out(3)"); K.shake(K.boxes.ic, 6.05, 10, 5); K.out(bang, 7.6, 0.2);
    // dragged into a meeting
    const room = el("card", { left: "1360px", top: "250px", width: "420px", height: "330px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "16px" },
      `${CLOCK}<div style="font:900 40px/1 Roboto">Meeting</div><div style="font:700 30px/1 Roboto;color:var(--red)">1 hour</div>`);
    K.slide(room, 9.6, 200);
    tl.to(K.boxes.ic, { left: "1360px", top: "130px", scale: 0.7, duration: 0.6, ease: "power3.in" }, 9.8);
    tl.to(K.boxes.ic, { opacity: 0.45, duration: 0.3 }, 10.4);
    tl.to(dep, { top: `${330 - 45}px`, duration: 0.5, ease: "back.out(1.6)" }, 10.6); tl.to(dl, { opacity: 0, duration: 0.2 }, 10.5);
    const ch = K.chip("Deputy steps in", 0, 0, "#22a35a", "#fff", 34); Object.assign(ch.style, { left: "750px", top: "400px" }); K.pop(ch, 11.2, 0.5);
    const hh = room.querySelector("#mh"); tl.fromTo(hh, { rotation: 0, svgOrigin: "60 60" }, { rotation: 720, svgOrigin: "60 60", duration: 2.6, ease: "none", immediateRender: false }, 10.2);
  }

  if (K.SCENE === 81) {
    // (placed from 0.79, when pilot 4 fades) "every person in the chain of command has their own levels of experience (4.43 / 5.23), comfort (6.19), et cetera (6.97).
    //  So three (7.85) is not a magic number (9.33 / 9.59) for everybody (10.67). All of those things impact who you assign (13.65 / 14.13) to what positions (15.33)
    //  and how many (16.37 / 16.65) and which subordinate positions (17.65 / 18.39) you assign to each of them (20.83)"
    const k = el("kicker", { fontSize: "28px" }, `<span class="bar"></span>Delegation`); K.fadeIn(k, 0.8, 0.2);
    const SUP = [[420, "Support A", 0.35, 0.45, 2], [960, "Support B", 0.95, 0.9, 5], [1500, "Support C", 0.6, 0.65, 3]];
    SUP.forEach(([x, l, ex, co, n], i) => {
      const b = K.box(`s${i}`, x, 230, l, "sup", 300, 84, 32); K.pop(b, 1.0 + i * 0.15, 0.7);
      const m1 = el("meter", { left: `${x - 150}px`, top: "315px" }, `<i style="background:var(--blue)"></i>`), l1 = el("mlab", { left: `${x - 150}px`, top: "288px" }, "EXPERIENCE");
      const m2 = el("meter", { left: `${x - 150}px`, top: "375px" }, `<i style="background:var(--amber-deep)"></i>`), l2 = el("mlab", { left: `${x - 150}px`, top: "348px" }, "COMFORT");
      K.fadeIn([m1, l1], 4.3, 0.2); K.fadeIn([m2, l2], 6.05, 0.2);
      tl.to(m1.querySelector("i"), { scaleX: ex, duration: 0.6, ease: "power2.out" }, 4.45 + i * 0.1);
      tl.to(m2.querySelector("i"), { scaleX: co, duration: 0.6, ease: "power2.out" }, 6.2 + i * 0.1);
      // positions they can carry
      for (let j = 0; j < n; j++) {
        const px = x - (n - 1) * 52 + j * 104;
        const p = K.box(`p${i}${j}`, px, 520, "", "pos", 84, 70);
        K.conn(`c${i}${j}`, `s${i}`, `p${i}${j}`, null, "var(--line)", 4);
        tl.set(K.lines[`c${i}${j}`], { opacity: 0 }, 0);
        tl.to(K.lines[`c${i}${j}`], { opacity: 1, duration: 0.01 }, 16.3 + i * 0.25);
        tl.to(K.lines[`c${i}${j}`].style, { strokeDashoffset: 0, duration: 0.35 }, 16.3 + i * 0.25);
        K.pop(p, 16.45 + i * 0.25 + j * 0.05, 0.5);
      }
      const cnt = K.chip(String(n), x - 30, 590, ["var(--red)", "#22a35a", "var(--blue)"][i], "#fff", 40); K.pop(cnt, 17.7 + i * 0.15, 0.4);
    });
    // three is not a magic number
    const scr = el("", { position: "absolute", inset: 0, background: "rgba(239,239,237,0.94)" }); K.fadeIn(scr, 7.7, 0.25);
    const three = el("", { position: "absolute", left: 0, right: 0, top: "150px", textAlign: "center", font: "900 300px/1 Roboto", color: "var(--ink)" }, "3");
    K.pop(three, 7.8, 1.6, "power3.out");
    const strike = el("", { position: "absolute", left: "820px", top: "300px", width: "280px", height: "22px", borderRadius: "11px", background: "var(--red)", transform: "rotate(-20deg)", transformOrigin: "0 50%" });
    K.hide(strike); tl.fromTo(strike, { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 9.3);
    const not = el("", { position: "absolute", left: 0, right: 0, top: "500px", textAlign: "center", font: "900 64px/1 Roboto", color: "var(--ink)" }, `not a <span style="color:var(--red)">magic number</span> for everybody`);
    K.rise(not, 9.4, 20);
    K.out([scr, three, strike, not], 11.6, 0.35);
    const who = K.chip("Who, what, and how many: it depends on the person", 0, 0, "var(--ink)", "#fff", 32); center(who); who.style.top = "640px"; K.rise(who, 13.6, 16); K.out(who, 16.2, 0.2);
  }

  if (K.SCENE === 82) {
    // part a (0 to 22.77): "The 14 management principles (0.27 / 1.77) ... are not 14 standing silos (4.29 / 6.21). They connect with each other (6.85 / 7.49) ... include accountability (15.57),
    //   which is really saying you're responsible (18.79) for everybody underneath you (19.85 / 20.65), all the resources (21.25) that are there (21.99)"
    // overlay (22.77 to 30.0) on a check-in table: "check in (25.13) and check out procedure (25.87 / 26.41) helps to identify how many (28.57) and what type (29.19)"
    // part b (30.0 to end): "on scene (30.29) and helps supporting leadership (31.45 / 32.25) to adequately manage them (34.29 / 34.81)"
    const P = ["Common terminology", "Modular organization", "Management by objectives", "Incident action planning", "Manageable span of control", "Incident facilities and locations",
      "Comprehensive resource management", "Integrated communications", "Establishment and transfer of command", "Unified command", "Chain and unity of command", "Accountability",
      "Dispatch and deployment", "Information and intelligence management"];
    if (PART !== "overlay") {
      const k = el("kicker", { fontSize: "28px" }, `<span class="bar"></span>NIMS management characteristics`); K.fadeIn(k, 0.2, 0.2);
      const pos = P.map((_, i) => i < 10 ? [280 + (i % 5) * 340, i < 5 ? 230 : 360] : [450 + (i - 10) * 340, 490]);
      const tiles = P.map((t, i) => { const d = el("p14", { left: `${pos[i][0] - 160}px`, top: `${pos[i][1] - 55}px`, width: "320px", height: "110px", fontSize: "27px", zIndex: 2 }, t); return d; });
      tiles.forEach((t, i) => { K.hide(t); tl.fromTo(t, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 0.3 + i * 0.1); });
      const n14 = K.chip("14", 1740, 80, "var(--blue)", "#fff", 40); K.pop(n14, 1.7, 0.5);
      // silos: tall grey walls between tiles, then they drop and lines connect
      const walls = [...Array(4)].map((_, i) => el("", { position: "absolute", left: `${446 + i * 340}px`, top: "160px", width: "8px", height: "400px", borderRadius: "4px", background: "var(--line)", zIndex: 1 }));
      walls.forEach((w, i) => { K.hide(w); tl.fromTo(w, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.25, immediateRender: false }, 4.3 + i * 0.05); });
      const silo = K.chip("Not silos", 0, 0, "var(--red)", "#fff", 40); center(silo); silo.style.top = "580px"; K.pop(silo, 5.9, 0.5); K.out(silo, 7.4, 0.2);
      tl.to(walls, { scaleY: 0, opacity: 0, duration: 0.3, ease: "power3.in" }, 6.75);
      const svg = K.ensureSvg();
      const NS = "http://www.w3.org/2000/svg";
      const pairs = [[0, 7], [1, 4], [2, 3], [3, 8], [4, 11], [5, 6], [6, 12], [7, 13], [8, 9], [9, 10], [10, 4], [11, 6], [12, 7], [13, 3], [1, 8], [0, 13], [2, 11], [5, 12]];
      const lines = pairs.map(([a, b], i) => {
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", pos[a][0]); l.setAttribute("y1", pos[a][1]); l.setAttribute("x2", pos[b][0]); l.setAttribute("y2", pos[b][1]);
        l.setAttribute("stroke", "#2c7ef4"); l.setAttribute("stroke-width", 4); l.setAttribute("opacity", 0); svg.appendChild(l);
        tl.to(l, { attr: { opacity: 0.55 }, duration: 0.25 }, 6.9 + i * 0.06);
        return l;
      });
      const con = K.chip("They connect", 0, 0, "var(--blue)", "#fff", 40); center(con); con.style.top = "580px"; K.pop(con, 7.45, 0.5); K.out(con, 12.0, 0.2);
      // accountability and span of control light up
      tl.to(tiles.filter((_, i) => i !== 11 && i !== 4), { opacity: 0.25, duration: 0.3 }, 15.4); tl.to(lines, { attr: { opacity: 0.12 }, duration: 0.3 }, 15.4);
      tl.to(tiles[11], { backgroundColor: "#2c7ef4", color: "#fff", borderColor: "#2c7ef4", scale: 1.15, duration: 0.3 }, 15.5);
      tl.to(tiles[4], { borderColor: "#f2a93b", duration: 0.3 }, 15.6);
      const acc = el("", { position: "absolute", left: 0, top: 0 });
      tl.to(tiles[11], { left: "835px", top: "190px", scale: 1.4, duration: 0.6, ease: "power3.inOut" }, 18.6);
      tl.to(tiles.filter((_, i) => i !== 11), { opacity: 0, duration: 0.3 }, 18.6); tl.to(lines, { attr: { opacity: 0 }, duration: 0.3 }, 18.6);
      for (let j = 0; j < 12; j++) { const p = K.person(400 + j * 102, 470, j % 3 === 0 ? "var(--amber-deep)" : "var(--blue)", 0.8); K.pop(p, 19.8 + j * 0.06, 0.3); }
      const all = K.chip("Responsible for everyone and everything under you", 0, 0, "var(--ink)", "#fff", 34); center(all); all.style.top = "580px"; K.rise(all, 20.6, 16);
      // part b: the board after check-in
      const scr = el("", { position: "absolute", inset: 0, background: "var(--bg)" }); K.hide(scr); tl.set(scr, { opacity: 1 }, 29.99);
      const brd = el("card", { left: "360px", top: "170px", width: "1200px", height: "420px" },
        `<div style="position:absolute;left:40px;top:30px;font:900 28px/1 Roboto;letter-spacing:0.14em;color:var(--blue)">ON SCENE</div>
         <div id="tot" style="position:absolute;right:40px;top:18px;font:900 64px/1 Roboto">14</div>`);
      K.hide(brd); tl.set(brd, { opacity: 1 }, 29.99);
      [["Engines", 3, "var(--blue)"], ["Crews", 6, "var(--amber-deep)"], ["Dozers", 2, "var(--slate)"], ["Ambulances", 3, "#22a35a"]].forEach(([l, n, c], i) => {
        const row = el("", { position: "absolute", left: "40px", top: `${100 + i * 74}px`, right: "40px", height: "60px", display: "flex", alignItems: "center", gap: "18px", font: "700 34px/1 Roboto" },
          `<span style="width:260px">${l}</span>` + [...Array(n)].map(() => `<i style="width:44px;height:44px;border-radius:10px;background:${c};display:inline-block"></i>`).join(""), brd);
        K.slide(row, 30.2 + i * 0.15, -40);
      });
      [[560, "Branch"], [960, "Division"], [1360, "Group"]].forEach(([x, l], i) => {
        const b = K.chip(`${l} leaders`, x - 140, 640, "var(--ink)", "#fff", 28); b.style.top = "620px"; K.pop(b, 31.4 + i * 0.2, 0.5);
      });
      const up = K.chip("Supports leadership", 0, 0, "var(--blue)", "#fff", 34); center(up); up.style.top = "84px"; K.pop(up, 32.2, 0.5);
    } else {
      // overlay part: check-in / check-out
      const a = el("ochip", { left: "120px", top: "110px", background: "#22a35a" }, "Check in"); K.slide(a, 25.05, -80);
      const b = el("ochip", { left: "420px", top: "110px", background: "var(--red)" }, "Check out"); K.slide(b, 25.8, -80);
      const c = el("ochip", { left: "120px", top: "210px", background: "rgba(29,38,51,0.85)" }, "How many? What type?"); K.slide(c, 28.5, -80);
    }
  }

  if (K.SCENE === 83) {
    // "Another principle (0.29) is this modular organization (1.33 / 1.73) ... plug modules in (4.41 / 5.29) to your organization when you need them (7.21)
    //  and you can unplug them (8.35 / 8.91) when you don't (9.61)"
    K.header("Another principle", "Modular organization", 0.25, 1.4);
    K.box("ic", 960, 250, "Incident Commander", "ic", 420, 84, 32); K.pop(K.boxes.ic, 2.6, 0.7);
    const rail = el("", { position: "absolute", left: "260px", top: "330px", width: "1400px", height: "22px", borderRadius: "11px", background: "var(--ink)" }); K.fadeIn(rail, 2.8, 0.3);
    const D = [["Operations", 450, 4.35], ["Planning", 790, 4.75], ["Logistics", 1130, 5.15], ["Finance/Admin", 1470, 5.5]];
    const drs = D.map(([l, x, t], i) => {
      const d = el("drawer", { left: `${x - 150}px`, top: "400px", width: "300px", fontSize: "32px" }, l);
      K.hide(d); tl.fromTo(d, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, t);
      return d;
    });
    const plug = K.chip("PLUG IN", 120, 600, "#22a35a", "#fff", 40); K.pop(plug, 4.35, 0.5); K.out(plug, 7.9, 0.2);
    tl.to([drs[3], drs[2]], { y: -300, opacity: 0, duration: 0.45, ease: "power3.in" }, 8.35);
    const un = K.chip("UNPLUG", 120, 600, "var(--slate)", "#fff", 40); K.pop(un, 8.4, 0.5);
  }

  if (K.SCENE === 84) {
    // overlay on Marines training: "manage everything with the rule of three (7.25 / 7.73) ... structures units within three subordinate units (11.37 / 12.33) with each one (13.35)"
    const band = el("", { position: "absolute", left: 0, right: 0, top: "120px", height: "330px", background: "linear-gradient(90deg, rgba(10,14,22,0.0), rgba(10,14,22,0.72) 20%, rgba(10,14,22,0.72) 80%, rgba(10,14,22,0))" });
    K.fadeIn(band, 7.1, 0.3);
    const t = el("", { position: "absolute", left: 0, right: 0, top: "170px", textAlign: "center", font: "900 120px/1 Roboto", color: "#fff", letterSpacing: "0.02em" }, `THE RULE OF <span style="color:var(--amber)">THREE</span>`);
    K.pop(t, 7.2, 1.5, "power3.out");
    const top = el("", { position: "absolute", left: "930px", top: "330px", width: "60px", height: "40px", borderRadius: "8px", background: "#fff" }); K.pop(top, 11.3, 0.5);
    [-140, 0, 140].forEach((dx, i) => {
      const s = el("", { position: "absolute", left: `${930 + dx}px`, top: "400px", width: "60px", height: "40px", borderRadius: "8px", background: "var(--amber)" }); K.pop(s, 11.6 + i * 0.12, 0.5);
    });
    const ln = el("", { position: "absolute", left: "818px", top: "382px", width: "284px", height: "6px", background: "#fff" }); K.fadeIn(ln, 11.55, 0.2);
    const vl = el("", { position: "absolute", left: "957px", top: "370px", width: "6px", height: "14px", background: "#fff" }); K.fadeIn(vl, 11.55, 0.2);
  }

  if (K.SCENE === 85) {
    // "a fire team (2.45 / 2.69), consists of three Marines (3.53 / 3.73) ... led by a corporal (6.35), the first rank above private (7.13 / 8.33).
    //  A squad (10.45) consists of three fire teams (11.61 / 12.27). A platoon (13.11) consists of three squads (14.51 / 14.73)"
    const world = el("", { position: "absolute", left: 0, top: 0, width: "1920px", height: "1080px", transformOrigin: "0 0" });

    tl.to(cpl, { opacity: 0, duration: 0.2 }, 10.2);
    // squad
    tl.to(world, Object.assign(cam(360, 400, 2.4), { duration: 0.8, ease: "power3.inOut" }), 10.3);
    tl.to([sqBox[0], ftBox[1], ftBox[2], ...icons.slice(3, 9)], { opacity: 1, duration: 0.3 }, 10.5);
    tl.call(() => { lab.textContent = "Squad"; sub.textContent = "3 fire teams = 9 Marines"; }, null, 10.45);
    tl.fromTo(lab, { scale: 1.3 }, { scale: 1, duration: 0.3, immediateRender: false }, 10.45);
    // platoon
    tl.to(world, Object.assign(cam(960, 400, 1), { duration: 0.8, ease: "power3.inOut" }), 13.0);
    tl.to([sqBox[1], sqBox[2], ...ftBox.slice(3), ...icons.slice(9)], { opacity: 1, duration: 0.3 }, 13.3);
    tl.call(() => { lab.textContent = "Platoon"; sub.textContent = "3 squads = 27 Marines"; }, null, 13.1);
    tl.fromTo(lab, { scale: 1.3 }, { scale: 1, duration: 0.3, immediateRender: false }, 13.1);
    tl.call(() => { lab.textContent = "Fire team"; sub.textContent = "3 Marines"; }, null, 0.01);
  }

  if (K.SCENE === 86) {
    // "It goes all the way up to the very top (2.00). The commandant (2.88) of the Marine Corps (4.18) supervises three structures underneath (5.50 / 7.34)"
    const LV = ["Platoon", "Company", "Battalion", "Regiment", "Division"];

    LV.forEach((l, i) => {
      const y = Y(i);
      [-420, 0, 420].forEach((dx) => el("", { position: "absolute", left: `${800 + dx}px`, top: `${y}px`, width: "320px", height: "84px", borderRadius: "16px",
        background: dx === 0 ? "#e8f1ff" : "#fff", border: `4px solid ${dx === 0 ? "var(--blue)" : "var(--amber-deep)"}`, font: "700 34px/76px Roboto", textAlign: "center", color: "var(--ink)" }, l, world));

  if (K.SCENE === 88) {

    const q1 = el("q", { top: "290px" }, `<b>?</b><span>What factors influence span of control?</span>`); K.slide(q1, 2.6, 140);
    const q2 = el("q", { top: "460px" }, `<b>?</b><span>How do you regain span of control?</span>`); K.slide(q2, 5.3, 140);
    tl.to([q1, q2], { opacity: 0, x: -200, duration: 0.4, ease: "power3.in" }, 8.0);

    if (PART !== "overlay") {
      K.header("Where to go from here", "Learn the other ICS modules", 0.3, 1.2);

      M.forEach((m, i) => {
        const d = el("p14", { left: `${300 + (i % 3) * 460}px`, top: `${300 + Math.floor(i / 3) * 150}px`, width: "400px", height: "110px", fontSize: "30px",

      const d = el("ochip", { left: "120px", top: "210px", background: "rgba(29,38,51,0.85)" }, "Gain leadership experience"); K.slide(d, 19.1, -80);
